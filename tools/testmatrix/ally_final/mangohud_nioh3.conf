# MangoHud config for the Nioh 3 final benchmark (ROG Ally X). Installed by run_log.sh install.
# Logging only: nothing here changes TDP / governor / gamescope. Columns match captures/ally/*.csv.
fps
frametime
frame_timing
cpu_stats
cpu_temp
cpu_power
cpu_mhz
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
vram
ram
swap
procmem
font_size=18
background_alpha=0.4
position=top-left
# --- logging ---
output_folder=__OUT__
log_interval=0
log_versioning=0
# run_log.sh trims each window to its nominal length (20/20/25 s), so a late stop is harmless
log_duration=40
toggle_logging=Shift_L+F2
# F10 is the mod menu; the overlay itself stays on MangoHud's default hotkey (Shift_R+F12)
