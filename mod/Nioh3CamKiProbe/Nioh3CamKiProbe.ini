; Camera add-on. A missing key leaves the game camera alone.
; The Camera page writes CamOffsetRight, CamOffsetUp, CamDist, and CamFovDeg.
; Menus, equipment appearance, and photo mode use the game camera. Saved values come back after.
; OnProton is Linux/Proton only. 0 (default) installs the camera hooks after a player
; exists. 1 installs them at startup (boot crash, Ally #62930). 2 never installs them.
