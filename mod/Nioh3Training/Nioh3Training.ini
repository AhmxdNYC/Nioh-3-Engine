; Nioh3Training.ini - arena swap for "Fight now" (bridge 4506). Put next to Nioh3Training.asi and Nioh3Training_arenas.tsv.
[ArenaSwap]
; AutoArena (#23451): 1 (default) = at startup the arena rows are also derived from the game's own data files (archive folder, no game
; addresses; ~0.2 s): any boss mission / boss character Nioh3Training_arenas.tsv does not have yet (game patch, DLC) gets its arena row and a
; summon roster entry. The TSV stays the cache + override (tools/auto_arena.py regenerates it). 0 = TSV only.
AutoArena = 1
; CoverReleaseMs (pc2 #8619): cross-world Fight now only. N ms after the arena is ready, clear GAMESTATE[2] by hand so the black cover drops early. -1 = off (default), 0 = immediately.
CoverReleaseMs = -1
; LoadingScreenEndMs (#9182): cross-world Fight now only. N ms after the arena is ready, call the game's UiLoadingScreenEnd once (closes the native
; loading screen early; GAMESTATE[2] untouched). -1 = off (default), 0 = immediately.
LoadingScreenEndMs = -1
; BossGraceAfterCoverMs (#9133): every arena-swap boss spawns with its AI off and gets it back this many ms after the screen is really visible
; (GAMESTATE[2] 0, mission load sequencer done = seq not 1..15, fade overlay clear). -1 = off (old: boss active at spawn). BossHoldMaxMs caps the hold.
BossGraceAfterCoverMs = 1500
BossHoldMaxMs = 60000
; 1 (default) = Fight now for a boss whose arena is in the world you are standing in skips the mission load: the player is warped
; into the arena and the boss is spawned live (0.5 s with the boss model preloaded, about 10 s cold; the native load is 40-46 s).
; Other worlds, rows not in the table, a running load: the caller keeps the native mission load. 0 = off.
Enable = 1
; 1 = Nioh3Training_Preload() (Boss Rematch calls it when its menu opens) requests the boss models of the PreloadMax nearest bosses of this world.
Preload = 0
PreloadMax = 3
; 1 = also preload once per world, 4 s after landing (no menu hook needed; costs a small hitch + memory). Default 0.
PreloadAmbient = 0
; The swapped-in boss is placed at most this many game units (100 = 1 m) from the player along the catalogue line: an idle boss only notices the player within about 10 m. 0 = catalogue position.
BossDistance = 900
; 0 (default) = Boss Rematch must call Nioh3Training_FightNow(missionId) itself (see notes/training-fightnow-arena-4506.md).
; 1 = also hook MissionRequestById and swap for any add-on caller. With Boss Rematch 1.4.13 this makes the menu report 'native request uncertain; restart game' (it expects a load), so leave it 0.
HookFightNow = 0
AwareFix = 0
; bridge 5276: 1 (default) = Fight now for a boss in another world does a WarpOtherWorld request (no mission load), then the in-place arena swap (~10 s); any failure falls back to the native mission load. 0 = always native for other worlds.
CrossWorld = 1
; bridge 5455/539: 1 = swap as soon as the stage is ready even while GAMESTATE[2] (load flag) is still 1 (Ally: 30 s later). pc2 23.2 -> 8.7 s.
CrossWorldEarlySwap = 1
; bridge 6375: ms to wait after 'stage ready' before the swap (was fixed 700)
CrossWorldSettleMs = 700
; bridge 6375: 1 = Nioh3Training_Preload()/PreloadFor(mission) (menu opened) already starts the world request for CrossWorldPrewarmMission (0 = the last cross-world boss); Fight now for a boss of that world claims it
CrossWorldPrewarm = 1
; bridge 6550: 1 = menu opened only loads the boss resources (never switches the world); 2 = also issues the real WarpOtherWorld (cancelled + returned to the old world when the menu closes without Fight now or after CrossWorldPrewarmHoldMs)
CrossWorldPrewarmHoldMs = 30000
CrossWorldPrewarmMission = 0
; bridge 5294: 1 = request the boss model resources together with the world request (hides the ~8 s boss load behind the stage load)
CrossWorldPreload = 1
; bridge 6047b: 1 = with CrossWorldPreload = 1, request the boss resources only once the world has switched (stage world byte = target), not with the request.
; Reason (static RE): the mission sequencer's state 1 (MissionLoadStep 223AF50) consumes the world request only when LoadIsLoadEnd passes, and its gate G5
; (any entry of the resource list [45B9E60] with +2C8h == 0) holds while the boss model loads, so the early preload delays the switch itself (~6 s on the Ally).
; After the switch the boss load overlaps the field entity load the sequencer waits for anyway. 0 (default) = request with the world request (old behaviour).
CrossWorldPreloadAfterSwitch = 0
; bridge 6047c: after a cross-world switch (Fight now cross-world or the oworld command) the mission sequencer (state 5 MissionLoadStep, then 8) waits in
; LoadIsLoadEnd until every placeable (area object) of the new world's loaded cells has finished loading (StageAreasObjectsReady 3B3A28; ~16 s on the Ally).
; N > 0 = once the target world is current and its stage init state is 5, treat that gate as passed N ms later; the placeables keep loading in the background
; (props / destructibles / their collision can pop in for a few seconds). Only the all-areas call made in sequencer states 5/8 of the target world is affected.
; 0 (default) = native wait. Try 500.
CrossWorldAreaObjSkipMs = 500
; pc2 placeable-skip: 1 = during a cross-world switch, do not queue placeable (area object) loads of the OLD world, nor of the NEW world outside the row's
; arena cells (tsv col 16); they load normally once the new world landed with the load flag clear, or after CrossWorldPlaceableSkipMaxMs. 0 (default) = no patch.
CrossWorldPlaceableSkip = 0
CrossWorldPlaceableSkipMaxMs = 20000
; pc #8552 (branch pc/near-arena-only): 1 = during a cross-world Fight now queue ONLY the placeables within NearArenaRadius (cm; 15000 = 150 m) of the
; player or boss spawn, inside the arena cells too; the rest (and the old world) are held until control + fade-in, so the cross-world hold ends when the near set is in. 0 (default) = off.
NearArenaOnly = 0
NearArenaRadius = 15000
NearArenaMaxMs = 40000
; bridge 6047: stage cell streaming after a world switch (Fight now cross-world and the oworld command). The game starts at most 4 stage-cell loads at
; once (31DFB8: loading + release-queue count < 4 and map [stage+1B48h] < 4), and the old world's cell releases use the same 4 slots, so the new world trickles in.
; N (5..64) = raise that cap to N from the world request until every cell of the new world is loaded (or 60 s), then restore 4. More cells load in parallel
; (higher I/O and memory peak during the switch). 0 (default) = native cap; the XSTREAM timeline (state 5 time, cells loaded/total) is logged either way.
; Live: cmd `cellcap N` sets it now (4 = native), `cellcap` prints the counters. UNVERIFIED in game; try 12 first.
CrossWorldCellLoads = 0
; bridge 6233 (ally): 1 = clear the stage cell-admission gate (+0x11F1) from the world request until stage state 5; 2 = keep it cleared until the arena swap fires (or the swap aborts/times out). 0 = off.
CrossWorldBlockCells = 2
; bridge 4718: fog gate, arena intro cutscene, boss BGM, clear flags and rewards belong to the boss's mission script, which only runs in the mission's own load.
; NativeEnter = 1 (default): for the missions listed in NativeMissions, Fight now keeps the native mission load (the caller requests it) and, once you have landed, warps you into the
; arena trigger so the script starts the real fight (verified: Yamagata R1CBC, 66 s from the request). If neither a boss nor an intro starts 30 s after the warp, Fight now falls back to the in-place swap.
; NativeMissions = comma list of mission ids whose trigger is verified to fire from the table's arena point, or * for every table row. 0 for NativeEnter = always the instant in-place swap.
NativeEnter = 1
NativeMissions = 0x1CBC
; bridge 4717: owner fallbacks when no live registered actor exists to own the swapped-in boss (owner = player gives handle 0x50000001, a passive boss with no HP bar).
; OwnerWaitMs: keep retrying the owner pick this many ms (0 = off). OwnerActivate = 1: while waiting, ActivatePlacement up to 12 registered enemy placements (waits 4000 ms if OwnerWaitMs is 0).
OwnerWaitMs = 0
OwnerActivate = 0
; bridge 5479: 1 (default) = reset boss-gauge HUD state (hud+0x2C/+0x1F) before each ShowBossGauge so summons 2+ get an HP bar again. 0 = off.
GaugeStateReset = 1
[Summon]
; bridge 4942: no-load training. 1 (default) = Nioh3Training_FightNow(missionId) summons the boss next to the player in the map that is loaded (any world, no mission/stage load)
; and returns 1; the arena swap / native load paths above are not used. 0 = old behaviour.
; SpawnVerify = 1: spawn at a walkable candidate (player trail first, then a fan) and respawn at the next one when the boss has not closed in after 5 s (bridge 5467)
SpawnVerify = 1
FightNowSummon = 1
; bridge 5338: 1 (default) = when the boss is in the world you stand in, Fight now uses its own arena (in-place warp, ~4 s, no load) with a retry session (stays in the arena); 0 = open-world summon
FightNowArena = 1
; boss distance from the player in game units (100 = 1 m); idle bosses notice the player within about 10 m
Distance = 300
; 1 = while a session runs the player cannot die (native Character::SetNoDeath); HP at the floor = beaten (see AutoRetryOnDeath below)
PlayerNoDeath = 1
; user #14147: 1 (default) = every Training / Boss Match session (Practice, Fight now arena, 'train') keeps player NoDeath on even with PlayerNoDeath 0,
; and re-applies it after a load / when it went off, so dying there is always the in-place round reset (never the game's death + shrine load). 0 = PlayerNoDeath decides.
SessionNoDeath = 1
; user #14150 / #14267 'Infinite health' (menu: Practice > Player, also from the Return-object page; saved here). 1 (default) = in a Training / Boss Match
; session the player never loses HP (refilled as soon as it drops). 0 = normal damage; HP at the floor counts as a death: respawn in the arena after
; BeatenRespawnMs (full HP, round-1 spot, boss respawned; stance, repeat move and aggro kept). Neither ever runs the game's death / shrine load (SessionNoDeath).
PlayerCantDie = 1
; ms from the HP floor to the in-arena respawn (0 = at once, default; 0..5000; was a fixed 2000)
BeatenRespawnMs = 0
; 1 = a summoned boss (menu summon) also turns player NoDeath on (bridge 12666); it goes off again on Despawn all, when every summoned boss is dead/gone,
; or when the session ends. 0 (default, user #13197) = summoned bosses can kill you.
SummonNoDeath = 0
; > 0 = respawn the boss this many ms after it is killed (0 = wait for 'retry' / Nioh3Training_Retry)
RespawnOnWinMs = 0
; 1 (default) = call the native Character::SetAwareFlg on every summoned boss AwareDelayMs after it appears (the duel script does this when the player is within 8 m; without it bosses like Shingen stay idle)
AwareFlag = 1
AwareDelayMs = 400
; user #13164: a boss summoned from the mod menu's 'Summon Boss' page stays passive (AI off) this many ms after it appears, then attacks.
; 0 = aggressive at once. 0..60000, default 3000. Also set live from the Summon Boss page (Passive time slider, saved here).
SummonPassiveMs = 3000
; bridge 5201: perception list of a CreateDynamic boss (8 target slots). Live on ally the player was always in it (owner live or player, worlds 0xB1 and 0xE0) and the boss attacked.
; PerceptionFix 1 = 0.6-8 s after the spawn, while the player is missing from the boss's list, write the player into a free slot the way the native
; perception update does, make it the current target and SetAwareFlg; 2 = also AlgoActiveFlag(1) + AI reset first. 0 (default) = off (untested live: never needed on ally). PerceptionDiag 1 = log the list every 2 s (PERC lines).
PerceptionFix = 0
PerceptionDiag = 1
; #6185 summoned-boss death. BodyFade 1 (default) = the dead body stays BodyFadeDelayMs on the floor, then fades out (native FadeOut 30 frames) and is deleted 6 s later; 0 = it stays.
BodyFade = 1
BodyFadeDelayMs = 25000
; #6774/#7234: on every confirmed kill (any toggle mix) the body fade starts at the kill and lasts KillFadeFrames (60 = 1 s); 120 keeps the death animation visible. BodyFadeDelayMs = fallback only.
KillFadeFrames = 120
; #8827 KillFadeDelayMs: after a confirmed kill (any kill path, incl. KiBreakNoFinisher) the body fade starts this many ms later, so the death animation
; plays first (capped by BodyFadeDelayMs; 0 = fade at the kill, the old behaviour that hid the body mid-animation).
KillFadeDelayMs = 5000
; DeathBlowRequired 1 (default) = the boss must be finished with the death blow (finisher) as now; 0 = it dies natively as soon as its HP reaches the floor (no finisher).
DeathBlowRequired = 1
; CutsceneOnKill 1 = one finisher is enough: when the first finisher animation ends (or FinisherKillTimeoutMs after it started) the boss is killed natively and its
; death animation plays (no second finisher). 0 (default) = old behaviour. The mission's own boss-defeat cutscene (RTM) is NOT played: it lives in the mission script.
CutsceneOnKill = 0
FinisherKillTimeoutMs = 6000
; #9585 FinisherKillTimeoutMs and KiBreakHp0WindowMs also have sliders in the Boss Rematch menu (live, saved here).
; #9685 BossBarAfterVisibleMs: the boss HP bar waits until the screen is visible (no load cover / load sequencer / fade overlay) + this many ms (max 60 s). -1 = at once (old).
BossBarAfterVisibleMs = 600
; BossLoot 1 = the native kill above is EnemyForceKillWithItemDrop: the boss's own drop table (loot pillars) and Amrita drop. Also turns on the one-finisher kill.
; Script/first-clear rewards (mission reward, guardian spirit, story items) are not granted. 0 (default) = no loot (old behaviour).
BossLoot = 0
; #7118 AutoRetryOnDeath = what 'beaten' does: player and boss reset instantly (the 'dejavu' retry; boss respawned RetryRespawnMs later).
; user #13229/#13230: ALWAYS ON in Training/Rematch. This key is ignored (0 is not honoured) and there is no Boss Rematch menu toggle any more:
; dying never removes the boss or sends you to the Return gate / shrine. Kept only for reference.
AutoRetryOnDeath = 1
; #6781 (temporary) GoldKiBar 1 (default) = boss Ki bar tinted gold (GoldKiRGB) by rewriting its UI vertex colours; 0 = native.
; GoldKiLearn 1: passive, no gameplay change (#7234): the boss Ki is only read; the bar quad whose width follows the boss Ki on 3 Ki changes is tinted (log 'GOLDKI: element').
; GoldKiColors = RGBA hex list (as printed by GoldKiDump) tints quads of those exact colours from the first frame. GoldKiDump 1 = log 120 quads once.
GoldKiBar = 1
GoldKiRGB = 255,200,50
GoldKiLearn = 1
GoldKiColors =
GoldKiDump = 0
; #7290 KiBreakLog 1 (default) = passive log of boss Ki breaks and the Ki-break finisher (grapple) hits: 'KIBREAK start/end', 'KIFINISHER state on/off', 'KIFINISHER hit'.
; Read only (boss Ki/HP/state never written), any boss with an HP bar. 0 = off. See notes/ki-break-finisher.md.
KiBreakLog = 1
; #7465/#7467 KiBreakNoFinisher 1 = a boss (any boss with an HP bar) can NOT be grappled: no Ki-break finisher and no death-blow grapple, the player keeps comboing.
; While the boss is Ki-broken its Ki bar is gold (Ki bar only, HP bar untouched). At HP 0 the boss is Ki-broken, its gold Ki bar drains over KiBreakHp0WindowMs
; and it only dies (native kill, drop per BossLoot) when no hit lands in that window; every hit refills the bar. 0 (default) = native. Run time: 'nofin 0|1 [ms]',
; or the Boss Rematch root row 'No finisher (Ki break)' (applies now, saved here). See notes/ki-break-nofinisher.md.
KiBreakNoFinisher = 0
KiBreakHp0WindowMs = 1000
; #9542 KiBreakKneelBlockAll 1 (default) = also block the native kneel (the crouch) during NORMAL Ki breaks at HP > 0 (Ki <= 0 / broken), not only at HP 0.
KiBreakKneelBlockAll = 1
; #9542 KiBreakHp0AiHold 1 (default) = boss AI held off for the whole HP-0 window: no Ki-broken moves / dashes there, hit reactions stay native.
KiBreakHp0AiHold = 1
; #9543 KiBreakHp0FadeDelayMs: after the HP-0 window kill the body fade starts this many ms later (instead of KillFadeDelayMs; default 1000).
KiBreakHp0FadeDelayMs = 1000
; #9579 KiBreakBareFix 1 (default) = a 'bare' Ki break (break state without the stagger animation: the boss crouches, no hit reactions = the 'death stance')
; is cancelled after KiBreakBareMs and the boss Ki set to 0.5, so it fights on and the next hit breaks it with the real Ki-break stagger. Run time 'nofinbare 0|1'.
KiBreakBareFix = 1
KiBreakBareMs = 200
; #9895/#9937/#10069 KiBreakActFix 1 (default) = while the boss is Ki-broken at HP > 0 (not the HP-0 window) in a BARE break (break bit without the
; stagger bits = crouch / 'death stance', e.g. Yoritomo 0xFA6 / 0x4E3E) for KiBreakActFixMs, the boss's own learned real-stagger action (Yoritomo 0x4E4C,
; learned from its real Ki-break stagger, saved in Nioh3Training_learned.ini) is requested (at most KiBreakActFixMax per break, KiBreakActFixGapMs apart,
; inside KiBreakActFixWindowMs from the break start). A real stagger is never touched. KiBreakActFixMode 2 = forced (SetActionID
; path 66C4A8), 1 = pending request (RequestActionTrans field). Run time 'nofinact 0|1'. Every action change during a break is logged ('KIBRK ACT change').
KiBreakActFix = 1
KiBreakActFixMode = 2
; #9946 ids are LEARNED per boss at run time (see 'learned GOOD/BAD' log lines); these two are only optional seeds (empty / 0 = none)
KiBreakActBadIds =
KiBreakActGoodId = 0
KiBreakActFixMs = 100
KiBreakActFixMax = 3
KiBreakActFixGapMs = 500
KiBreakActFixWindowMs = 4000
; KiBreakHp0Kneel 1 = at HP 0 also force the native kneel-down (script ForceKneelDown). 0 (default): with boss AI on that kneel is the death-blow kneel and
; lets the player do the finisher (user play 2026-10-16 15:41).
KiBreakHp0Kneel = 0
; #8827 KiBreakHp0ClearDeathBlow 1 (default) = in the HP-0 window clear the boss's death-blow-available runtime bit (101) every frame, so no death-blow
; finisher can start at HP 1 (user play 16:09: finisher at HP 1 with the bit set). KiBreakGoldUnbreak 1 (default) = while the Ki bar is gold the Ki row is drawn
; in its normal (not broken) layout so the gold fill shows for the whole stagger (native broken layout has no fill to tint).
KiBreakHp0ClearDeathBlow = 1
KiBreakGoldUnbreak = 1
; KiBreakGoldFadeMs (#9133): when the gold ends (Ki-break state 0x23 over / Ki refilling) the Ki bar blends back to its native colour and real Ki over this long. 0 = instant.
KiBreakGoldFadeMs = 350
; KiBreakHp0Stagger (#9133): 1 (default) = a hit at the HP floor keeps the normal hit reaction + Ki-break stagger (skips the native death-blow pending flag and
; the HP-floor / dying motion 0x308 the revive branch requests on every hit). 0 = native HP-floor pose.
KiBreakHp0Stagger = 1
; KiBreakHp0NonLethal (#9319): 1 (default) = a hit that would take the boss below HP 1 is floored at HP 1 as a NON-lethal hit (native hit reaction,
; native Ki break = the real stagger, Ki primed so each floor hit re-breaks it) instead of the lethal HP-floor path. 0 = old path (A4F098 break bit).
KiBreakHp0NonLethal = 1
; KiBreakHp0Reserve (#9319): 1 (default) = once the boss drops to 20 % HP it gets a hidden HP reserve (20 % max) and its HP bar shows real - reserve, so
; no hit at the shown HP 0 is ever lethal (a lethal hit starts the native dying sequence = the crouched "dead" look ~2.25 s later). 0 = floor at HP 2.
KiBreakHp0Reserve = 1
; KiBreakHp0Prime: 1 (default) = hold the Ki at 0.5 in the HP-0 window so a hit can break it (native break not yet seen at HP 0, #9319).
KiBreakHp0Prime = 1
; KiBreakBlockDeathBlow (#9135): 1 (default) = while the boss Ki bar is gold (break, HP-0 window, HP floor) the HP-floor death blow is not offered
; (StateTest 0x27 false for that boss) and grab boxes without the Ki-broken flag miss it. 0 = only the older grapple / down-target blocks.
KiBreakBlockDeathBlow = 1

[Return]
; LoadScreen (#8902): 1 (default) = Return to where I was shows the Boss Rematch loading screen look titled 'Return' (needs the matching Nioh3EngineFix.asi); 0 = plain black.
LoadScreen = 1
; #6789/#6798 'Return to where I was' as a physical object: the game's mission clear gadget (type 851) spawned in the arena while a Boss Rematch / training
; session runs, a spot is stored and no boss is alive and no respawn is pending (not before a boss spawns: #7138). Interacting with it (native MissionRequestReturn, diverted) or
; standing on it ReturnGateTouchMs (after leaving it once; 0 = off) runs Return to where I was. Gadgets cannot be deleted: it stays for the session, inactive during a fight.
ReturnGate = 1
; placement ids tried first (scripts use 10/11/13), then a scan of the loaded gadget set; FakeRecord 1 = synthesize a type-851 record if none is loaded.
ReturnGateIds = 10,11,13,12
ReturnGateFakeRecord = 1
; distance from the arena player start, away from the boss
ReturnGateDistance = 220
ReturnGateTouchMs = 1500
ReturnGateRadius = 110
; #9543: 1 = the gate sits on the floor (height from where the player stood: trail samples near the gate, else their median), 0 = old (round-1 pose height, ~1 m in the air)
ReturnGateGround = 1
; #13255 ReturnGateAlways 1 (default) = the gate is in the arena from the session start (spawned 3 s after the round-1 boss is alive, same spot/ground);
; interacting with it during a fight opens our gate page (Fight again / Return). Face-button mask, pad A and stand-on stay idle-only. 0 = old (gate only once idle).
ReturnGateAlways = 1
; #9664/#9670 ReturnGateOpenOnA 1 (default) = pad A within ReturnGateMaskRadius of the gate opens OUR gate page at once (native end-mission prompt stays masked; needs Nioh3EngineFix.asi with MaskGameButtons + MenuOpen). 0 = stand-on only.
ReturnGateOpenOnA = 1
; #13796 ReturnGateZone 1 (default) = ONE zone for every mode (Practice, Stand still, Boss Match, idle): within ReturnGateMaskRadius of the Return
; object the face buttons are hidden from the game (no native 'This will end the mission' box), a TAP of ReturnGateOpenButtons (4096 = 0x1000 = A, released
; within ReturnGateTapMs) opens our gate page, a longer hold does nothing. If a native box is open anyway, nothing is hidden and our page closes so
; the box can be answered. 0 = old (idle-only 400 u mask + 110 u boss-alive mask).
ReturnGateZone = 1
ReturnGateOpenButtons = 4096
ReturnGateTapMs = 350
ReturnGateMaskRadius = 400
; #9909 ReturnGateMaskHoldMs (default 2000) = the native interact stays hidden this long after the player leaves ReturnGateMaskRadius (no flicker gap after a lost-round put-back next to the gate).
ReturnGateMaskHoldMs = 2000
; #9909 ReturnGateBlockNativePrompt 1 (default) = the game's own 'This will end the mission. Proceed?' box (EndMissionConfirmOpen 12A1F80, action 0x2613) never opens while our Return gate is up; interacting with the gate opens OUR gate page instead (any input: pad, keyboard). 0 = old (input mask only).
ReturnGateBlockNativePrompt = 1
; #10022 ReturnGateBlockDialog 1 (default) = lowest chokepoint: DialogOpen 348274 (every Yes/No box) drops any box whose text is 'This will end the mission' / 'abandon the mission' while our Return gate is up and the player is within 600 u of it (or our gate page is open / was requested < 1.5 s ago); every box while the gate is up is logged with its caller stack. 0 = off.
ReturnGateBlockDialog = 1
; native-endmission-box-source: ReturnGateHookScriptBox 1 (default) = hook the clear gadget script native UI::OpenCommonWindowTwoButton 23F8CC0 (the real source of the Return object's 'This will end the mission. Proceed?' box): while our gate is up, that box from our gate gadget (or within 600 u of it) never opens, the script gets 'no button' and our gate page opens instead. 0 = off.
ReturnGateHookScriptBox = 1

[Fade]
; bridge 6519: black transition around Fight now / arena switches (own click-through overlay window). Same-world: fade out, swap behind black, hold until the new arena has settled, fade in.
; Cross-world: black from the Fight now call until the new world's arena has settled. Enable 0 = old behaviour (no overlay).
Enable = 1
OutMs = 250
InMs = 400
; hold at least this long after the swap, and until the boss exists, stage state 5, no placeable loads in flight, and that stayed true for StableMs; give up after MaxHoldMs
MinHoldMs = 800
StableMs = 500
; ally #8076: once the boss is spawned and the player released, wait at most AreaWaitMs (StableMs counts from the boss-ready moment) for the open-world placeable streaming, then fade in (was: wait for all, 26-44 s black with a live boss). 0 = wait for all
AreaWaitMs = 500
; ally #618 (Shingen 11 s live under black): CROSS-world arenas only - hold the boss spawn + player control, then the fade-in, until no arena cell is blocking and the game's load cover (GAMESTATE[2]) is down, at most this long after 'ready'. 0 = off (same as AreaWaitMs)
AreaWaitCrossMs = 15000
MaxHoldMs = 60000

[Fade]
; pc2 #6801: -1 (default) = hold the cover until every placeable (prop) load finished. N >= 0 = once control is back (GAMESTATE[2] = 0) release the cover N ms after boss/stage are ready even if props are still loading.
; Measured on pc2: no gain on a cold cross-world Fight now (the cover ends with the game's own control lock, ~27.5 s after the world request); harmless with CrossWorldPrewarm = 2.
PlaceableWaitMs = -1

; pc2 #6801 (in [ArenaSwap]): CrossWorldLoaderGateSkip = 1 NOPs LoadIsLoadEnd gate G9 (loader busy flags) during a cross-world switch. Sequencer state 5 ends ~8 s earlier but state 6 (actor-ready wait) then holds the same total: no gain, default 0.
; Recommended for fast Fight now on slower-loading cross-world bosses: CrossWorldPrewarm = 2 (+ CrossWorldPrewarmHoldMs = 120000), measured on pc2: menu open >= 27 s before the press -> cover 1.0 s (cold 27.4 s; 10 s of menu -> 17 s).

[Record]
; #9291 screen recording tied to Boss Rematch: 1 = every Fight now starts Nioh3FightRecorder.ps1 (game folder) hidden: ~3 fps half-size jpgs
; in OutRoot/rec_<stamp>/, stops at Return, game exit, 90 s after the fight ends or MaxMinutes. 0 (default) = off.
; Script (default <game dir>/Nioh3FightRecorder.ps1), OutRoot (default <game dir>)
Enable = 0
MaxMinutes = 20

[Debug]
; #9658 in-mod hotkeys (game window in front): FreezeKey (virtual-key code, default 120 = F9) toggles a freeze of the whole fight + player (game time scale 0) and logs
; the boss state (action id, last motion, HP, Ki, break bits) + a screenshot; BugKey (default 119 = F8) = "BUG HERE" log line + screenshot. ShotDir default [Record] OutRoot\marks.
Hotkeys = 1
FreezeKey = 120
BugKey = 119
; user #22356 FrameProbe 1 = log-only frame probe: one FRAMEPROBE line per boss hit-window opening (hit-record setup 2B4A3C), its end, and a per-action
; run summary (startup / active / recovery in ms and 60 fps frames) in Nioh3Training.log. Read at start. 0 (default) = off, no hook installed.
FrameProbe = 0
; #35176 IFrameProbe 1 = log-only: one IFRAME line whenever the player action id or a candidate i-frame state word changes (notes/iframes.md)
; #35411 also IFRAMEPR (per-tick no-damage predicates of the player) and IFRAMEWN (per-action field scan): works in an empty area, no enemy. 2 = also the old IFRAMEST / IFRAMEOB dumps.
IFrameProbe = 0
