SealEndOnIdle = 1
SealIdleEnd = 2
SealIdleMinMs = 300
SealIdleLoop = 1
SealIdleHold = 1
SealIdleHoldMs = 100
SealExitSmokeSide = 0
FormHideDelayMs = 400
SealExitRevealMs = 100
SealCoverSmoke = 1
SealShowMs = 400
SealExitYokaiHideMs = 0
SealGhostFadeMs = 250
SealExitSmokeAtMs = 1450
SealPlayerFadeMs = 250
SmokeFreezeStart = 0
SmokeFreezeEnd = 0
; Probe and dev logs stay off in the public ini. YawWatch's code default is 3, so it is set here.
SlotProbe = 0
PartProbe = 0
SlotWatch = 0
YawWatch = 0
Probes = 0
SealIdleLog = 0
FormHideActLog = 0
FormCommit = 0
FormAttach = 0
EquipDiff = 0

