; Nioh3BossRematch.ini - the boss logger + boss rematch add-on (separate from Nioh3EngineFix; notes\boss-rematch-addon.md).
; Put Nioh3BossRematch.asi, this ini and Nioh3BossRematch_bosses.tsv next to the other ASI mods. Log: Nioh3BossRematch.log.
; Patch-resilient: every game site is found by a wildcard byte pattern or a script-native name; each feature group switches
; itself off (with the reason in the log) when its sites are not found, the others keep working. Works with or without
; Nioh3EngineFix.asi; the old [Debug] BossLog / RematchLog / InvLog and [Rematch] keys of Nioh3EngineFix.ini moved here.

[General]
Enabled = 1
; seconds to wait for the game's code to be decrypted (SteamStub) before resolving anyway
DecryptWaitSeconds = 120

[Training]
; Experimental read-only entry counts only; session snapshots/epochs are not implemented.
; Independent of Rematch and Debug logs. Counts are entries, never live actors or completed spawns.
Observe = 0
; Reserved: mutation support is unavailable; this key does not enable any command.
Enable = 0

[Rematch]
; SOLO / OFFLINE ONLY. 1 (default) makes Boss Matches and the Practice catalogue available in the menu.
; Lists every boss with its route and status; fights start only when selected. 0 = off: nothing is installed.
Enable = 1
; R rows: 0 = open the game's own Battle Scroll replay list (R-a; you pick the mission there); 1 = start the mission directly (R-b,
; MissionRequestById exactly as the shrine replay confirm; only missions cleared on this journey).
DirectStart = 0
; 1 = while the game's replay list is opened by the add-on, the 3 hidden duels are listed too (record bit 0x4000 cleared, restored after)
HiddenDuels = 0
; 1 = also list bosses that are not beaten yet and bosses without a route (greyed, with the reason)
ShowAll = 1
; 1 = allow rows that are not verified yet (direct records, hidden duels, Picture Scroll records); verify_all.ps1 verifies them
ShowUnverified = 0
; Boss pages always show Fight now and Shrine before the boss, with unavailable reasons.
; Once Rematch Enable = 1, both start-point actions are enabled by default. Explicit 0 keeps them off.
; Solo/offline and cleared-current-journey gates still apply; explicit Rematch Enable = 0 keeps it off.
FightNow = 1
; AnyBoss = 1 (default): a boss you have not beaten yet still opens as a Practice boss right here (no mission, nothing written to the save). 0 = beaten bosses only.
AnyBoss = 1
; Arena entry is on by default. Fight now requires a native-at-fight start or a validated arena point;
; it never substitutes a shrine/gate-only route. Explicit 0 disables warp routes, not native-at-fight starts.
; Shrine before the boss uses the start point alone; unavailable when the mission starts at the fight.
FightNowWarp = 1
; Fight now (in the arena) without the shrine first: while the Fight now runs, the start point's warp-point record (in memory only)
; spawns at the arena point, so the load ends with you already in the arena (and a death reload puts you back there). The start
; point id the game keeps / may save never changes; the record is restored when the Fight now ends. If it does not take, the warp
; above runs as before. 1 = on (default, needs FightNowWarp = 1), 0 = load at the start point and warp after the landing (1.3.x).
FightNowSpawn = 1
; #12444 'Teleport to arena (normal loading)' is not plain: TeleportFastLoad = 1 ends each teleport load's loading screen once the boss world's stage is
; ready (the lsfade of a cross-world Fight now) and requests the boss gate sooner. TeleportLoadingScreenEndMs / TeleportCoverReleaseMs: -2 = use
; Nioh3Training.ini [ArenaSwap] LoadingScreenEndMs / CoverReleaseMs (the Fight now values), -1 = off. TeleportGateMs: gate request delay after landing (plain 2500).
TeleportFastLoad = 1
TeleportLoadingScreenEndMs = -2
TeleportCoverReleaseMs = -2
TeleportGateMs = 300
; 1 = at every boss fight start, append the player position to Nioh3BossRematch_arenas.tsv (read at launch: it gives / corrects the
; arena point of that boss). The position is always written to the log ('Rematch: arena:').
ArenaCapture = 0
; Self-test without the pipe (any device, e.g. Proton): a comma list of row ids, or 'arena' = every row with an arena point. After the
; save loads the add-on runs Fight now on each row by itself, logs 'SELFTEST <id> PASS/FAIL', leaves the mission, goes on, and ends
; with 'SELFTEST DONE'. It plays real missions on the loaded save: back the save up first. Empty = off (default).
SelfTest =
Catalog = Nioh3BossRematch_bosses.tsv
Verified = Nioh3BossRematch_verified.tsv
Arenas = Nioh3BossRematch_arenas.tsv

[Menu]
; Settings remain available with Rematch off. D-pad / stick or arrows move/change; A selects, B returns one level.
; Settings are startup preferences: Save, then restart. Free-form paths/lists and reserved training mutation remain ini-only.
; LB/RB (PgUp/PgDn) skips ten rows; no preference is enabled just by opening this menu.
; the add-on's own overlay (a topmost window; no graphics hook). Overlay = 0: pipe / log only.
Overlay = 1
Hotkey = F7
; hold View + D-pad Up for 1 s to open / close; the pad is masked from the game while the menu is open
PadGesture = 1

[Remote]
; 1 = \\.\pipe\nioh3bossrematch (local only) for tools\rematch\verify_all.ps1
Pipe = 0
; Opt-in local hosted Fight now test queue. Requires Pipe=1 and live Engine host.
; Keeps renderer ACK and all ordinary native gates; default off.
HostedFightTest = 0

[Debug]
; BossLog: read-only boss fight logger (fight start/end, placements created, mission flags, clear, rewards). grep BossLog
BossLog = 0
; RematchLog: Phase 0 logger of the rematch design (Emaki table, mission requests, replay menu, getters, end/retry). Implies BossLog hooks.
RematchLog = 0
; InvLog: every inventory add of the session with its caller (grep InvLog)
InvLog = 0

[Spirit]
; FormKey=1 (or pipe `rm spirit formkey on [hex X]`): log the soul-core summon body key (FormKey lines), then once call SetForm 74C2FC with that key
; via the 0x11793D0 call-site override. Installs its own hooks (2916C5C, 2E6C34) and the seal path (MotionReq from 65ADA6, 65A8A8 desc[0]); 0 by default.
FormKey = 0
; SealEndOnIdle=1 (pc #56896): end the soul-core form as soon as the seal yokai's attack action turns into its idle action (id 0x1), instead of
; letting it stand idle until the game despawns it (Ibaraki idles ~0.8 s). Multi-hit moves keep playing: it waits for the action->idle edge,
; never a hit. Queues the despawn through 681E9C (byte-checked); a SealDefer hold is released instead. 0 by default.
SealEndOnIdle = 0
; SealEndOnHit=1 (pc #57014): end the form as soon as the seal yokai's LAST hit window closes (collider pool, burst count per core from
; [SealHits]; unknown cores are learned from one full form, SealEndOnIdle is the fallback). 0 by default.
SealEndOnHit = 0
; SealSpeed=<x> (pc #57226, FormHide=4): the soul-core yokai's motion rate x from bind until it despawns (default 1.4, <=1 off).
; SealTailSpeed=<x> (with SealEndOnHit): after the last hit the rest of the animation plays at x (default 4), reached by a linear ramp
; from SealSpeed over SealTailRampMs milliseconds (default 250, 0 = step).
SealSpeed = 1.4
SealTailSpeed = 4
SealTailRampMs = 250
; SealExitFx=1 (pc #57269, with SealEndOnHit): at the last hit spawn the dark appear effects the yokai shows when it first spawns on the
; player, then despawn the yokai under them after SealExitFxMs (default 150) and restore the player inside; the tail speedup is skipped.
; SealExitFxId = hex list (default the Ibaraki spawn-hit set 63056,63047,6304A,6304D,63050,63053,6307E,63027), SealExitFxBone = attach
; bone id (0), SealExitFxOwner 0 = player, 1 = seal.
SealExitFx = 0
; FormModel=1 (with FormKey=1): do not swap the form key; give SetForm's model slot the seal yokai's own slot-1 model ([[chr+50]+10]) once and
; queue the game's Living Artifact request (0x4E). Experimental, 0 by default.
FormModel = 0
; FormAppear=1 (with FormKey=1): at the seal spawn, write the seal yokai body id [[schr+E8]+248] into the player appearance block
; [[chr+560]+4] and set +814=0x01010101 so ED584 reloads (pc #54368). Replaces the key swap. Undo: pipe `rm spirit formkey appear off`. 0 by default.
FormAppear = 0
; FormAppearKick (pc #54571 v2, only with FormAppear=1; FormAppear now uses only the FIRST seal chr): after the id write, 1 = set blk bytes +80F/+810/+811/+812=1
; like the game's reload request 846B3C (state walks 6->8->0xA->0->1, +814 consumed at state 1), 2 = force state +804=1, 0 = none. Pipe: `rm spirit formkey appear kick N`.
FormAppearKick = 1
; FormAppear=3 (pc #54739): like 1, plus blk+0 (chr id the EE7B4 model request is keyed on) = seal chrId before the kick; restore puts both back.
; PartProbe=1 (with FormKey=1): log every part-id staging F3D78 (all 10 sites in F3478) and every chr part apply 2C4450 (8 callers), any chr.
PartProbe = 0
; FormSlot0 (pc #54830, with FormKey=1): while the seal is armed, the player's first kind-0 part id becomes the seal's (0x40244A). 1 = only that,
; 2 = also the other kind-0 slots + kinds 1/2/3/D/E emptied (-1). Reload via cached [slot+20]=-1 + one rebuild; restore after 60 s / LA end / pipe `formkey slot0 off`.
FormSlot0 = 0
; SlotWatch=1 (pc #54925, with FormKey=1): hardware write watch (debug registers, all threads, 4 s) on a staged player kind-0 slot
; [slot+2F8]/[slot+40], armed at the first boot staging and after the FormSlot0 apply; logs every writer RIP + stack ('SlotWatch' lines).
SlotWatch = 0
; SlotProbe=1 (pc #54959, with FormSlot0): 3 s after the FormSlot0 apply, log the player kind-0 slot state [+18]/+2F8/+2F9/+40/+48/+10
; on every change, plus 406668 asset-DB lookup of the seal id (NULL = state 5, asset missing). 'SlotProbe' lines.
SlotProbe = 0
; FormCommit=1 (pc #55034, with FormSlot0): log the 3FD37C appearance-tick chr walk (20 call sites; is the player in it, F2D02 gate fields) and,
; for ~1 s after the FormSlot0 kick, call 3FD37C(player, 1, 0) once per frame; logs the player kind-0 slot state before/after. 'FormCommit' lines.
FormCommit = 0
; FormAttach=1 (pc #55111, with FormSlot0): forced 3FD37C(player,1,0) per frame for ~2 s after the kick; once the slot holds the seal id, copy the
; seal slot's load request [+60..+7F] and set state [+18]=1 so 903088 (mesh attach) / 2C5FBC run for the player. 'FormAttach' lines.
FormAttach = 0

[SealHits]
; hit bursts per soul-core yokai (chr id hex), see SealEndOnHit. Learned values are appended here by the mod.
5129B=2
A2ACB=2
