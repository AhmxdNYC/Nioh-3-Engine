; sweeps, so a finished stage's dead pages are dropped instead of swapped (level-load hitches on the Ally). Chunk headers
; are never touched. Start-up self-test: if resetting 64 MB of scratch does not lower the working set, LM turns itself
; off (log "LM: self-test FAILED"). Log: "stats lm:" every 30 s. Next launch. 0 = off (default everywhere).
