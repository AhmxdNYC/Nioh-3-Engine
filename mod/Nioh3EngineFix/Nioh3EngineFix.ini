CrashTest = 0
CrashTestDelaySec = 30
; Opt-in DXGI crash evidence. 1=first 16 calls + 1/sec + failures; 2=30-second rolling trace.
; Writes Nioh3EngineFix-dxgi-report.txt (15 lines), -detail.txt and .bin beside this INI.
; Files are replaced on next launch: copy them before restarting. Restart after changing these keys.
DxgiDiag = 0
; Isolation only: skip overlay/ApplyLatency/PresentArgs; unrelated patches remain active. Requires DxgiDiag.
DxgiDiagPresentPassthrough = 0

; PresentModeLog (1.7.44, notes\vrr-present.md): MEASUREMENT ONLY. One log line whenever a Present caller changes its
;     SyncInterval / flags (and what VrrPresent sent instead), and whenever the engine's own SyncInterval state changes, with
;     the writer that set it (VSync watcher, setter + its caller, or the device default). grep PresentMode. 1 (default) = change
;     lines (capped at 200 per session), 2 = also a 30 s count summary, 0 = off (no PM probe sites installed).
PresentModeLog = 1
; SkipDebugString (1.7.45): 1 = mod log lines go to Nioh3EngineFix.log only, not also to OutputDebugStringA (unless a
;     debugger is attached). Under Proton each OutputDebugStringA is a raised exception + a wineserver round trip (91/s in a
;     profiling run on the Ally). 0 = stock behaviour (both). (notes\game-logic-audit.md 4)
SkipDebugString = 1
; HitchLog (1.7.86 hitchlog, default 1): MEASUREMENT ONLY. At each game-thread Present, when the gap since the previous one is
;     over HitchLogMs, ONE 'HITCH' line: gap, game-thread CPU time in the gap (busy vs waiting), process CPU, page faults, bytes
;     read, the last / longest mod-instrumented wait (W3 MsgWait, L1 limiter, F1, W6 present wait, GF fence, DS) with counts, mod
;     menu / pause / Training mode, loader queues (LoadStats on), free RAM, commit, VRAM used/budget. No line, no I/O without a
;     hitch (3 cheap counter reads per frame). Summarize with tools\hitch_from_log.py Nioh3EngineFix.log. 0 = off. Next launch.
HitchLog = 1
HitchLogMs = 100
; BossLog / RematchLog / InvLog moved to the separate add-on Nioh3BossRematch.asi (Nioh3BossRematch.ini, 1.7.41);
; setting them here only logs 'moved to Nioh3BossRematch'.
; FnProbe (1.7.34): live probe of game functions we could not name statically (notes\remaining-work.md 10.1). MEASUREMENT ONLY,
;     game behaviour unchanged. Per function: hits (+ per s and the peak 1 s), first/last hit time, first thread, the top 4 callers
;     (return RVAs; names are resolved offline by tools\playsession\summarize.py), and for the first FnProbeArgs hits the 4 integer
;     args + the first 16 bytes behind pointer args with hash-looking values marked. grep FnProbe. 0 = off (nothing installed). Next launch.
;     Cost: one locked add per call; the logger itself runs for the first FnProbeArgs hits and then 1 in FnProbeSample calls.
FnProbe = 0
; comma-separated RVAs (hex). Empty = the 14 Unknown_ functions of remaining-work 10.1 (bytes verified for v2.02). Other RVAs must be
; function entries whose first instructions are plain moves/pushes/sub rsp (checked at start; refused otherwise). Up to 32.
FnProbeList =
; seconds between reports (5-600; 0/absent = [Profiler] ReportSec)
FnProbeReportSec = 30
; argument dumps for the first N hits of each function (0-32)
FnProbeArgs = 8
; after the first FnProbeArgs hits, record the caller of 1 in N calls (rounded down to a power of two; 1 = every call)
FnProbeSample = 16
; PadLatency (1.7.35): controller latency inside the game (notes\pad-latency.md). MEASUREMENT ONLY, the game reads the same pad states
;     at the same time. Chains the game's XInputGetState import (like the mod menu) and stamps every pad change as the game reads it
;     (buttons, a trigger past the XInput threshold, a stick leaving / entering its deadzone or changing octant), follows it through the
;     TS probes (pad consumed -> limiter exit -> render begin -> present hand-off; PadLatency switches the TS probes on, v2.02) to the
;     next Present, and to the GPU completion of that frame (one fence Signal per frame on the game's queue). grep PadLatency: per
;     window and session total: changes, input->present and input->GPU-done p50/p95/p99, poll interval p50/p95/p99 (the game's own
;     pad sampling period). Not covered: DualShock/DualSense on the game's own HID path (no XInput), keyboard/mouse (PresentMon has
;     those). 0 = off (nothing installed). Next launch. Cost: two QPC reads per XInputGetState call (~6 per frame), one Signal per frame.
PadLatency = 0
; seconds between reports (5-600; 0/absent = [Profiler] ReportSec)
PadLatencyReportSec = 30
; SkipBootNotice (1.7.48): hands-free boots. The game shows "This game has an autosave feature ... [Confirm]" on EVERY boot (not only
;     the first; nothing stores that it was confirmed) and, when its VRAM check says the settings are too heavy, a Yes/No "reset all
;     settings to the defaults?" warning. 1 = skip both (the warning as if answered No: settings unchanged) and log the boot
;     sequencer state ("BootNotice: ..." lines). 2 = state log only. 0 = off (nothing installed). -1 (default) = 1 when Tour != 0
;     or VirtualPad != 0, else 0 - normal play is stock. notes\autosave-notice.md. Next launch.
SkipBootNotice = -1
; Tour (1.7.36): the stability / performance tour (notes\tour-mode.md; run it with tools\tour\run_tour.ps1, which also backs up and
;     restores the save folder). The mod loads each TourList mission itself (the game's Mission Replay request) and fast-travels the
;     player to TourPointsPerStage points per stage (arrival spot + the farthest of the game's own warp points), dwells TourDwellSec
;     at each and logs one "Tour P ..." line per point (fps, frame-time p50/p99, CPU, memory, handles, VRAM, load / warp seconds).
;     No input is sent; you press Continue at the title once, the tour arms TourStartDelaySec after the player stands in the field.
;     WHILE Tour != 0 THE GAME DOES NOT SAVE (the save writers report success without writing, and the save folder is write-guarded)
;     - for the whole session, not just the tour. Never play normally with Tour on. Refuses online / co-op.
;     0 = off (nothing installed), 1 = only missions this save has unlocked or cleared, 2 = every mission in the list. Next launch.
Tour = 0
; seconds measured at each point (1-1800)
TourDwellSec = 4
; points per stage: the arrival spot + (N-1) warp points (1-32)
TourPointsPerStage = 3
; list file (one mission key per line, '#' comments, "key@x,y,z" adds a point; relative to this ini); empty = the built-in 15 main
; missions (tools\tour\tourlist_main.txt is the same list, tourlist_full.txt has all 27 story missions)
TourList =
; repeat the whole list N times (2 = the leak check: the summary compares memory per point between passes)
TourPasses = 1
; a mission load that is not back in the field after this many seconds is logged as STALL and skipped (30-900)
TourLoadTimeoutSec = 120
; a warp (fast travel) that has not arrived after this many seconds is logged and skipped (10-300)
TourWarpTimeoutSec = 45
; seconds of a quiet field before the tour arms / after each load (settle)
TourStartDelaySec = 5
TourSettleSec = 3
; a warp point closer than this to an already used point of the stage is skipped (game units, 0 = no minimum)
TourMinPointDist = 3000
; VirtualPad (1.7.37): scripted controller for test harnesses, no OS-level input (notes\virtual-input.md; tools\testmatrix\vpad.py).
;     The game's XInputGetState import answers slot 0 from the named pipe \\.\pipe\nioh3vpad (local clients only; one text command per
;     line, one "ok ..." / "err ..." reply line: press A 100, hold B, release all, stick L 0 1 2000, trigger R 1 200, key ESC,
;     menu set GF 1 / menu get MQ (mod menu items set directly, no menu navigation), state, ping, help; 1.7.38: realpads on|off). Virtual keys need the mod
;     menu ([Menu] Enabled = 1); while the game is not the foreground window the real keyboard is hidden from it.
;     0 = off (nothing installed), 1 = exclusive (the real pads are hidden from the game for the whole session), 2 = merge (real
;     pads keep working, the virtual input is added on slot 0). Next launch. Never leave it on for normal play.
VirtualPad = 0
; held virtual inputs are released when no pipe command arrived for this many seconds (a harness that died mid-hold); 0 = never
VirtualPadIdleReleaseSec = 600
; KeepRunningUnfocused (1.7.37, v2.02): pads keep working and the game does not open its pause menu while its window is inactive
;     (three IsAppActive call sites answer "active"); the mouse / keyboard / cursor code keeps the stock answer, so an unfocused
;     game never reads your mouse or moves the cursor. Also opts the game out of Windows power throttling (EcoQoS and the
;     Windows 11 timer-resolution throttling of hidden windows) so unfocused timing equals focused timing. 0 = off. Next launch.
KeepRunningUnfocused = 0
; GIProbe (1.7.29): measurement for GIMerge (notes\gi-highest-audit.md s6, step A0). Every 30 s 'stats/s giprobe:' (gather
;     dispatches and groups per frame per shader, stencil refs/masks seen) and 'stats/s gimerge:' (pairs, why a pair cannot
;     merge, merges); plus one frame of per-dispatch 'GIPROBE' lines every GIProbeEvery frames (GIProbeFrames frames per
;     session): grid, gv_mask_param, CBV, cbuffer rows and root tables that differ from the previous same-shader dispatch,
;     and the merged (x', y') when one exists. Read-only. 0 = off, 1 = on.
GIProbe = 0
GIProbeEvery = 300
GIProbeFrames = 30
; SkipFx: DIAGNOSTIC for the cost-vs-looks audit (notes\cost-vs-looks.md, tools\testmatrix\cost_vs_looks.ps1). NEVER PLAY WITH IT ON.
;     1 = draws / dispatches of the listed PSOs (shader-hash fragments, >= 6 hex chars, e.g. b76874bb or ps=c4656a8d) and of
;     everything inside the listed engine markers (e.g. DrawSky, Cascade*; needs [Profiler] GPUProf_Markers = 1) are NOT rendered,
;     so the effect's GPU cost and its look can be measured. Live: the control file SkipFxFile ([SkipFx] Tag / PSO / Marker /
;     ClearMode / Clear) is re-read every 100 ms; an ack file (<SkipFxFile>.ack) reports what was skipped. Skipped compute keeps
;     its previous output (stale), skipped draws leave their target as it was (SkipClearMode = 1: clear the pass's own target to
;     SkipClear first). 0 = off (nothing installed). Next launch.
SkipFx = 0
SkipFxFile = Nioh3EngineFix_skip.ini
SkipPSO =
SkipMarker =
SkipClearMode = 0
SkipClear = 0,0,0,0
; LiveCtl: fast-testing control file for one-launch A/B windows (notes\fast-testing.md, tools\testmatrix\fastab.ps1).
;     1 = LiveCtlFile is re-read every 100 ms; its [Live] section sets live menu rows by key (PP = 1), ShaderHot sets
;     (Hot.ghdm = 1) and live [Tuning] values (Tuning.PP_Period = 8); <LiveCtlFile>.ack echoes Gen / Tag and the read-backs.
;     A file left from an earlier run is ignored until it changes. 0 = off. Next launch.
LiveCtl = 0
LiveCtlFile = Nioh3EngineFix_live.ini

