; CBS / CBN / CBT (1.7.60-cbu1, v2.02 only, code sites at launch; live Tuning.CBS / CBN / CBT = 0/1): the D3D12 replay thread
; copies every dirty per-draw constant buffer into the UPLOAD ring (in VRAM with ReBAR / SAM: CPU stores across PCIe) and
; re-copies the stage's CBV table. Same bytes reach the GPU in every mode. (notes\renderer\cbv-upload.md)
;   CBS: streaming copy (forward, full 64-byte lines, non-temporal stores) instead of memcpy; one sfence per table
;        ([Tuning] CBS_Fence = 1, live Tuning.CBS_FENCE; 0 = no sfence, like the stock memcpy's write-combined stores).
;   CBN: a slot whose bytes equal its previous upload in the same command list is not uploaded again (the old block stays
;        valid until that list completes).
;   CBT: with CBN, a stage whose slots all were no-ops binds its previous CBV table of the same list instead of a new copy.
; 0 = off, 1 = on, 2 = installed, switch off. CBN / CBT stay off with [GpuOpt] CbvMirror != 0.
; Default since 1.7.60-cbu2: CBN + CBT ON (pc2 5600X + RX 6650 XT, slow chipset PCIe link, CPU-bound, ReBAR on: +15.9 % fps, 38.3 -> 44.3, replay
; handlers 20.5 -> 17.1 ms/f; Ally Proton/RADV no-harm), CBS off (no gain on pc2, worse with its sfence).
