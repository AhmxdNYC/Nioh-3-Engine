; Every DIRECT command list Reset in a sampled frame (GPUProf2_SampleEvery) gets one GPU timestamp before its first GPU command
; and one at Close; per sampled frame the lists are ordered by GPU time and the idle stretches between consecutive lists are
; summed. Every 30 s: "GQ: frame: ..." (gaps / heads / tails per frame, compared with GP2's span - covered), the top GQ_Top gap
