; record on each render entry (+40h). The game then times that pass. No code patch. Log lines start
; with RNT:. Leave at 0 for benches and for play. notes\node-timer-33584.md
NodeTimer = 0
; VSForceSysUpload (with MemStats = 2, PC A/B only): 1 = UPLOAD heaps created as CUSTOM write-combine L0, 2 = write-back L0
;   (cache-coherent system memory: a driver cannot back it with BAR VRAM, so a ReBAR PC reads them over PCIe like a PC
;   without ReBAR). Changes performance only. 0 = off.
VSForceSysUpload = 0
; SceneBufProbe (1.7.57, measurement only): one hook on the meshlet scene-buffer update (MeshletFrameBegin 5D417); every 30 s
;   'SBM set' lines: per scene-buffer slot the usage (2 = UPLOAD written by the CPU each frame), resource, offset, capacity,
;   bytes written this frame, heap type and how many of the game's views (SRVs) point into it; with SceneBufMirror on also a
