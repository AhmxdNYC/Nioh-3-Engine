; files; event create/close/wait counts and costs; per-pool share of time in reads; a split at LoadGates' work end. Once at
; the title: a calibration line (cached read cost sync vs overlapped, first-touch reads 4/64/256 KiB, event pair cost).
; 2 = also a binary trace of every read per load: Nioh3EngineFix_reads_<n>.bin + .txt next to this ini (32 MB RAM). 0 = off.
; With ReadProbe on, LoadStats' read numbers come from these hooks (same counts). Next launch.
ReadProbe = 0
; TileStats (1.7.2): D3D12 tile-mapping census - MEASUREMENT ONLY. One "stats tiles:" line every 30 s: UpdateTileMappings
; calls / regions / ranges / tiles per frame by queue type (DIRECT/COMPUTE/COPY), CPU us inside the call (mean/max),
; CopyTileMappings, and ExecuteCommandLists / Signal / Wait per frame per queue type (game calls; other modules apart).
; 2 = also a one-shot trace of 256 calls after 60 s (QPC timestamps) and an estimate of redundant re-maps. 0 = off.
TileStats = 0
; GPUProf (1.7.0; 0 = off, 1 = markers, 2 = markers + per-PSO attribution): GPU pass profiler - MEASUREMENT ONLY. Turns on the engine's own debug markers (pass names) and times
; each marker on the GPU with timestamp queries (read back 6 frames later, no stall). Log: a "GP: frame N ms GPU" line and
; the top GPUProf_Top passes (inclusive / self ms, count per frame) every 30 s; the mod menu shows the top 5. Works on
; Windows and under Proton (vkd3d-proton). Costs some CPU per marker (the engine formats each name). 0 = off.
GPUProf = 0
; GPUProf = 2 (1.7.4, GP2): everything GPUProf = 1 does PLUS attribution of the work the engine's markers do not cover (they
; cover only ~25 % of the Ally's GPU time). The mod hooks SetPipelineState / Draw / Dispatch / Copy / Clear on the game's
; command lists, writes a GPU timestamp whenever the work changes bucket (new PSO at its first draw or dispatch, copy or
; clear, marker start / end, list end) and bills the GPU time between two timestamps to the bucket that was bound. Every 30 s:
; "GP2: frame X ms ...; covered Y ms", then the top GPUProf2_Top buckets: PSO shader hash(es) (the vs= / ps= / cs= container
; digests; the file names psoswap uses), ms per frame, draws+dispatches per frame, intervals per frame, [enclosing marker].
; NOTE: timestamps between draws on one queue measure GPU-pipelined intervals (when the previous work finished to when this
; work finished), so a PSO's number is an approximate cost; overlapping draws and barrier waits are billed to the PSO that was
; bound when the next stamp was written. Needs the PSO map from psoswap, which GPUProf = 2 turns on by itself (no swapping
; unless [ShaderSwap] Enabled = 1). The "GP2: overhead" line reports the mode's own cost (A/B windows, see GPUProf2_AB).
; GPUProf_Markers: 1 = only switch the engine's markers on (no queries), e.g. for a PIX / RenderDoc capture on the PC.
GPUProf_Markers = 0
; most markers timed per frame (256-8192); beyond that a frame's extra markers are not sampled
GPUProf_MaxMarkers = 2048
; passes listed in the 30 s log line (5-60)
GPUProf_Top = 30
; GP2: most PSO timestamps taken per frame (1024-65536); beyond that the rest of the frame is not sampled (counted as "dropped: cap")
GPUProf2_MaxStamps = 8192
; GP2: rows in the "GP2:" 30 s table (5-100)
GPUProf2_Top = 40
; GP2: 1 = measure the mode's own overhead: the 2nd and 4th 30 s windows run with the PSO stamps OFF, and the log compares
; the wall-clock frame time with them ON vs OFF (scene changes add noise). 0 = stamps always on.
GPUProf2_AB = 1
; GP2 (1.7.8) SAMPLING: stamp only 1 frame in N (1-64, default 8). The other frames take NO timestamps and the hook slots for
; SetPipelineState / Draw / Dispatch / Copy / Clear are switched off for them, so they pay nothing. The GP2 rows are per
; sampled frame (the digest scripts need no change); the "GP2: overhead" line compares sampled with unsampled frames live. 1 = every frame
; (old behaviour; the GPUProf2_AB windows then measure the cost).
GPUProf2_SampleEvery = 8
