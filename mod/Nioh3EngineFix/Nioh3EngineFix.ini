; Nioh3EngineFix - Nioh 3 (Steam v2.02) engine patches. 1 = on, 0 = off.
; Changes take effect the next time the game starts. A log is written next to the mod (Nioh3EngineFix.log).
; Most fixes can also be switched live from the in-game mod menu (F10, or triple-tap Start - see [Menu]); its
; "Save to ini" writes back into this file (Windows' WritePrivateProfileString: comments stay, edited lines become key=value).

[General]
Enabled = 1
Log = 1
; The mod refuses to run on any build other than v2.02 (PE timestamp 0x6AA7C106). 1 = try anyway by pattern
; matching only (each site is still verified; unsafe sites are skipped). Not recommended.
AllowUnknownBuild = 0
; How long to wait for the Steam DRM wrapper to decrypt the game code before scanning.
DecryptWaitSeconds = 60
; 1 = show a status popup for a few seconds once the game renders (mod loaded, fixes active, frame generation, VRR,
;     warnings). Drawn into the game's own picture, so it shows in Steam Deck / ROG Ally Game Mode (gamescope).
StartupPopup = 1
; StartupPopupSeconds = 8
; StartupPopupDelay = 3
; Skip the "press button to continue" screen after a load (loading a save from the title, starting a mission, fast travel
; and respawn loads that end on the tip page). OFF by default since 1.7.33 (user option). 1 = the tip page closes by itself as soon as the load is finished;
; 0 (default) = the game waits for your press as usual. Tips are still shown while the game is loading. Switch it live in the mod
; menu ("Skip loading tip screen"); the menu writes this key at once.
; Detail (1.7.22, notes\auto-continue-load.md): the tip page (UI slot 2Bh) only checks the confirm button after the
; game has set its "load done" byte (mission sequencer, after LoadIsLoadEnd). The mod makes that one check read
; "pressed" (call site 1CECAED -> 283950), so the page closes through the game's own close path, on the first frame
; the game would accept a press, and only when its other conditions also allow it. No other prompt, dialog, death
; screen choice or menu uses that check. v2.02 only; the code bytes are verified before the 5-byte call is retargeted.
AutoContinueLoad = 0
; Resizable BAR / Smart Access Memory check (1.7.56). Without ReBAR / SAM the GPU reads the game's per-frame data from system
; RAM over PCIe; turning it on in the BIOS cut GPU time 26 % on an RX 6650 XT in a slow chipset slot (measured fps only +6 %, CPU-limited) (README: "Biggest free fps
; boost: Resizable BAR"). 1 (default) = ~40 s after the game first renders, check it once (log line 'RB:') and, when it is off
; on a desktop graphics card, show a notice in the overlay ONE time (a file Nioh3EngineFix.rebarnotice next to the ASI then
; remembers it; delete that file to see it again). Never on handhelds / APUs or under Proton. 0 = no check, no notice.
ReBarNotice = 1

[Overlay]
; FPS counter drawn into the game's picture: "FPS" = frames the game renders and presents ("game N Hz" is added when
; the engine's update ticks differ), "FG FPS" = frames shown incl. generated ones ("FG: off" when FG isn't running).
FpsCounter = 1
; also show the real frame time (ms) and the game-speed factor (1.00x = real time; below 1 = the game runs slow)
FrameTime = 1
SpeedFactor = 1
; TopLeft, TopRight, BottomLeft, BottomRight
Position = TopLeft
; text size: 1.0 = 8x16-pixel letters (doubled automatically at 4K). Whole numbers (1, 2) look sharpest.
Scale = 1.0
; text brightness multiplier (HDR is compensated automatically)
Brightness = 1.0
; Where the counter sits, as distance from its corner's screen edges, in pixels at 1080p (scaled with the screen height).
; Left out: TopLeft starts 160 px down so it sits BELOW the game's own health / ki bars; the other corners use 0.
; The mod menu has 'Move FPS counter' and 'Nudge counter right / down' (Save to ini writes the values here).
;OffsetX = 0
;OffsetY = 160

[Menu]
; 0 = two pages (default). Page 1 keeps the picture and holds Boss Matches and Practice. Page 2 can change the look.
; 1 = the older grouped pages. Configuration by ini section lists every shipped key. Startup rows require Save and a restart.
Layout = 0
; In-game mod menu: switch the fixes and the overlay on/off while playing, see live stats, save to this ini.
; Opens at any time (gameplay, the game's pause menu, title screen). Drawn by the overlay above.
Enabled = 1
; Keyboard key that opens/closes the menu: F1..F12, Insert, Home, End, PageUp, PageDown, Pause, ScrollLock, None.
; The game never sees this key while the mod is loaded.
Key = F10
; Controller gesture: TripleTap = press the button 3 times quickly (within TapWindowMs) to open the menu, and again to
; close it; Hold = hold it for HoldSeconds (the old behaviour).
Gesture = TripleTap
TapWindowMs = 900
; SwallowTaps = 1: the game does not see the presses of a tap sequence (Start would also toggle its pause menu). A press
; with no follow-up within TapGapMs is handed to the game as a normal tap (so a single Start press is delayed by that
; long); a held button reaches the game after TapGapMs. 0 = every press passes through to the game immediately.
SwallowTaps = 1
TapGapMs = 300
; The button for either gesture:
; Start (= Menu/Options), Back (= View), L3, R3, LB, RB, or a combo such as Back+Start or L3+R3. None = off.
; A short press still reaches the game normally (Start opens the game's pause menu - that is fine).
HoldButton = Start
; seconds to hold (a countdown appears top-right after 1 s). 0 = open on a plain press of the combo
; (only sensible with a combo the game doesn't use, e.g. L3+R3).
; Hold gesture only:
HoldSeconds = 5
; button prompts in the menu footer: Xbox = A B X Y (default), PlayStation = Cross Circle Square Triangle
ButtonStyle = Xbox
; Live controller display (top-left, below the FPS counter), drawn like the Gamepad Viewer skins: the controller picture with
; each pressed button lit, the sticks moving and the triggers filling. ButtonStyle picks the pad: PlayStation = DualSense,
; Xbox = Xbox. 1 = on, 0 = off (default). Size: 1 = about 280 px wide at 1080p (0.5 .. 4, steps of 0.5). Opacity: 0.2 .. 1.
; Also in the mod menu (Mod menu controls). Art credits: README "Credits" (CrazyGrape, Cubio300: CC BY 3.0 US; skyqyzm: MIT).
ControllerDisplay = 0
ControllerDisplaySize = 1.0
ControllerDisplayOpacity = 0.8
; Pressed-part colour: White (default), Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink or a hex RRGGBB.
ControllerDisplayPressColor = White
; Input display (SF6-style input history, newest on top: frames held, direction arrow, buttons; read-only, shares the pad feed with the
; controller display, glyphs follow ButtonStyle). InputDisplay 1 = on, 0 = off (default). Side: Left (below the FPS counter) or Right.
; Rows: 4 .. 32 (the panel stops above the game's bottom HUD). Also in the mod menu (Display Overlays > Input display).
InputDisplay = 0
InputDisplaySide = Left
InputDisplayRows = 20
; menu text size: 0 = automatic (1.5 at 800p, 2 at 1080p, 2.5 at 1440p, 4 at 4K)
Scale = 0
; Small reminder top-right ("Mod menu: F10 / Esc x3 / Start x3"): 2 = always on screen (default), 1 = only while the
; game's pause menu is open, 0 = off
PauseHint = 2
; What decides that a game menu is open: Menu = the game's own 'menu open' signal (the one its frame generation uses to
; pause itself; covers the pause / options / title menus), StopFlags = the engine stop flags below (only the pause menu
; and loads set them), Both (default) = either.
PauseHintSource = Both
; Open the mod menu by pressing Escape three times (inside TapWindowMs, like the controller's triple-tap Start). The
; first presses are held back from the game for TapGapMs; a lone Escape is replayed to it afterwards. None = off.
KeyTripleTap = Escape
; Advanced: which engine stop flags (G+588..58D) count as "paused" for the reminder. 58B and 58C are the two that
; stop game time. The log lists the flags that change ("MENU: engine stop flags ... now: ..."); if the reminder
; doesn't show in the pause menu, put the flag logged while it was open here.
PauseHintFlags = 58B 58C
; Frame generation is status-only for every value, including legacy 1/2/3.
; Change game settings in the game's Options. Save to ini writes only mod settings.
; Legacy 3 still enables the independent FGC copy-job crash guard under Proton.
FrameGenToggle = 0

[Patches]
; Experimental paired meshlet completion wait. 0 stock, 1 enabled next launch.
; Preserves all meshlet work and completion checks; performance unvalidated.
MW = 0
; Experimental paired renderer-drain wait. Startup only; no work skipped.
RD = 0
; JT = 0   (fallback only: JT is read from [Profiler] first; [Patches] JT is read when [Profiler] JT is absent, so the abba2 harness arm "JT" works with an old ini. Leave at 0.)
; W1: zero-fill loop on GPU upload memory rewritten as rep stosd (main-thread CPU time, all PCs)
W1 = 1
; W2: per-vertex quad writer without read-modify-write on GPU upload memory (all PCs)
W2 = 1
; VRR: variable-dt frame timing - the game runs at real speed when the frame rate is below the in-game cap
;      (stock: below 120/60/30 fps the whole game slows down). OFFLINE ONLY - see VRROnline for co-op.
VRR = 1
; VRROnline (1.7.27): what VRR does in an online / co-op session. -1 = auto (default): suspended automatically while an
;      online session is detected (net manager connected or online play mode), restored 5 s after it ends; logged on the
;      "VRR:" lines. 1 = force VRR on even online (unsafe for co-op). 0 = force VRR off always (stock timing).
VRROnline = -1
; W3: window message pump sleeps until input/1 ms instead of spinning a CPU core
W3 = 1
; R1: game thread waits for the frame-latency signal with a 2 ms timeout instead of a busy poll
R1 = 0
; L1: frame limiter sleeps on a high-resolution timer instead of Sleep(0)-spinning (needs Windows 10 1803+;
;     turns itself off where the high-resolution timer is unsupported)
L1 = 1
; WK: job-system wake gate - skips waking a worker when no job queue holds work (fewer futile wake-ups:
;     less CPU power on handhelds; no fps change on desktops). 1 = on.
WK = 1
; WorkerCap: HANDHELDS ONLY. Shrinks the engine's job thread pools by capping their base at N threads
;     (ROG Ally / Steam Deck: try 10, then 8; fewer threads = fewer wake-ups and less power when GPU-bound).
;     0 = off (stock). Leave 0 on desktops: on a 6-core/12-thread PC it costs parallel width.
WorkerCap = 0
; AS0: EXPERIMENT, opt-in (1.7.5). The engine creates an extra async-compute queue for its effects path (async slot 0,
;     KIDS_ASync_LLCulling_Effect) on NVIDIA GPUs, but switches it OFF on every other GPU (AMD, incl. the ROG Ally). 1 = keep
;     it on like NVIDIA (one byte, written at startup before the renderer initialises; skipped if that is already too late).
;     RISK: Koei Tecmo disabled it on non-NVIDIA on purpose, reason unknown. Possible outcomes: faster, slower, effects one
;     frame late, visual corruption, or a GPU hang. Try it for one launch, compare, set back to 0 if it is not clearly better.
;     The log shows "AS0: slot 0 forced on" and "stats/s ASYNC: N async compute queue(s)". Next launch only. 0 = stock.
AS0 = 0
; AS: EXPERIMENT, opt-in (1.7.44, notes\gpu-async-wins.md). Successor of AS0 with a LIVE switch. The game has 13 async-compute
;     "slots"; KT wrote both a graphics-queue path and an async-queue path for each user, with its own fences. AS creates the
;     slots in [Tuning] AS_Slots at startup (0 = GPU effect simulation, 11 = grass vertex displacement, 12 = tree wind:
;     small, low-occupancy compute that otherwise runs alone on the graphics queue) and adds the row "Async compute slots (AS)"
;     to the mod menu: OFF = the stock queues, ON = AS's set, switchable in-game for an A/B in one launch.
;     Gains only when the GPU is the limit (PC at 1440p, Ally): measured offline on the RX 9070: 0.13 ms per frame (PC, slot 0), Ally est. 1-1.5 % with 0 11 12. Same shaders, so the
;     same picture. RISK: slot 0 is KT-disabled on non-NVIDIA (reason unknown; stable in earlier tests), 11 / 12 never ran on
;     PC: corruption or a GPU hang are possible - set 0 if anything looks wrong. Intel GPUs: slot 0 is refused.
;     0 = off (nothing written), 1 = slots + switch ON, 2 = slots created, switch OFF (live row). Supersedes AS0.
AS = 0
; W3 under Wine/Proton: 1 = sleep 1 ms on an empty message queue (Wine returns from the Windows-style wait at once,
; which made the message thread wake ~24,000 times/s on a ROG Ally). 0 = same wait as on Windows.
W3WineSleep = 1
; Under Wine/Proton (Steam Deck) L1 is skipped unless this is 1 - Wine may accept the high-resolution timer
; flag without honouring it, which would hurt frame pacing. Try 1 and compare frame times if you like.
L1OnWine = 0
; FG: FSR frame-generation presenter thread sleeps on a high-resolution timer instead of spinning on the clock
;     (~0.2 of a CPU core less with in-game FSR frame generation on; no effect with it off)
FG = 1
; Under Wine/Proton FG is skipped unless this is 1 (same timer caveat as L1OnWine)
FGOnWine = 0
; FGC (1.7.44): frame-generation copy-job guard. The game's FidelityFX backend skips a missing texture everywhere except
;     in its copy job, which then reads address 0x90 and crashes the game on the first generated frame (the crash in
;     vkd3d-proton issue #2845, "Nioh 3 crashes when enabling FSR FG"). 1 = skip that copy instead (bit-identical
;     while the texture exists). Logs "FGC:" when it fires and "stats/s FG:" (generated frames/s). 0 = stock.
;     [Menu] FrameGenToggle = 3 turns it on under Proton by itself.
FGC = 0
; P12: CPUs with 12 or fewer threads (Steam Deck, ROG Ally, 6-core desktops) get 3 fewer worker threads in two
;      engine pools (KIDS_RESOURCE, StageUpdate); this keeps them. Written at startup, before the pools are made.
;      Experimental: measured no fps gain on a Ryzen 5 7600X (the main game thread is the limit), so it is off.
P12 = 0
; ---- EXPERIMENTAL CPU-power patches (v2.02 only; 0 = not installed). Ports of live-tested memory patches, not yet
; load-tested inside the mod. For handhelds: every CPU watt saved goes to the GPU. A/B them live in the mod menu
; (section EXPERIMENTAL CPU POWER): an installed patch switches on/off at once; one that is 0 here can be set for the
; next launch there ("* restart"). The log prints a "stats/s exp:" line every 30 s so you can see each one working.
; W6: the main thread waits for Present to return with a short spin then a real sleep (WaitOnAddress) instead of a
;     Sleep(0) loop that keeps a core busy while the GPU is the limit. Biggest expected Ally saving.
; -1 (default) = auto by OS: 1 under Proton/Wine, 0 on native Windows (measured ~0 there). 0/1 force.
W6 = -1
; B: draw-list group-length search gallops instead of a full binary search (main thread, ~+5 % on PC)
B = 1
; PP: streaming page-pool usage sweep only every PP_Period-th frame (main thread)
PP = 1
; FPC: per-frame cache for material parameter lookups (main render thread)
FPC = 1
; AABB: character bounding boxes computed in SSE, bit-identical results (game-update thread). 1 = on, 2 = installed, switched off (live A/B)
AABB = 1
; M1: meshlet-request workers stop re-summing the page-pool capacity for every chunk (worker threads)
M1 = 0
; M2: meshlet workers read their page bitmaps with plain loads instead of locked ones (code bytes: on/off at launch)
M2 = 1
; M2S: completion-CAS seed reads only, retained locked CAS barrier; startup-only; full M2 takes precedence
M2S = 0
; J1: idle job workers poll their queues with plain loads instead of locked ones (code bytes: on/off at launch)
J1 = 1
; X1: the per-frame active-pad scan skips XInput slots the game already knows are empty (input thread)
X1 = 0
; E1: effects nobody can see are updated every E1_N-th pass with E1_N x the time step (game-update thread)
E1 = 1
; S1: PAUSE in the main thread's end-of-frame spin on the submit thread (code bytes: on/off at launch)
S1 = 1
; ---- INPUT LATENCY (1.2.0, v2.02 only) ----
; IK: the game reads the pad at the START of each logic frame instead of the end of the previous one (the sample is
;     ~4-9 ms fresher; same image, still one read per frame). Live switch in the mod menu (INPUT LATENCY). The frame it
;     is switched on reads the pad twice, so toggle it while not pressing anything. Safe online (only the read time moves).
IK = 1
; TS: timestamp probes, measurement only. The menu row shows the median pad read -> frame presented time (ms); the log
;     prints a "stats latency" line with every stage every 30 s.
TS = 0
; ---- WORKER WAKES (1.3.0, v2.02 only) ----
; WakeStats: counts the engine's job-worker wakes (SetEvent per site), worker sleeps per pool and where the wake checks
;     come from; "stats wakes/s" line in the log every 30 s. Measurement only. Live switch in the mod menu.
WakeStats = 0
; ED: effect-update (Disp) workers whose list is empty are not woken and not waited for (same output).
;     0 = off, 1 = on, 2 = installed but switched off (A/B it live in the mod menu: WORKER WAKES).
ED = 1
; ---- GPU FENCE WAITS (1.4.0, v2.02 only) ----
; GF: where the game waits for the GPU with `while (fence not reached) Sleep(0)` (main thread 7D9E1C, worker poll
;     117D6C), it registers an event with the fence (SetEventOnCompletion) and sleeps on it instead. Same wake-up
;     moment, no spinning core. Live switch in the mod menu (GPU FENCE WAITS); off = stock.
; -1 (default) = auto by OS: 1 under Proton/Wine, 0 on native Windows (+0.38 % fps, below the keep bar). 0/1 force.
GF = -1
; WL (1.5.0): the game asks the swapchain for its frame-latency wait handle every frame and never closes it (Windows:
;     one leaked handle per frame, ~13M after 60 h). WL closes the previous frame's handle. 1 = on. Never triggers
;     under Proton (no waitable swapchain there).
WL = 1
; ---- 1.6.0 (v2.02 only, all OPT-IN; notes\cpu-hotspots-ally.md, notes\worker-jobs-opt.md) ----
; WG: wake gate on the job system's two wake-one sites: while a worker of the same pool has been woken and has not yet
;     left its wait, a second wake-one is not issued (the woken worker scans every queue of the pool right after it
;     wakes, so the job runs; only which thread runs it can change). Cuts the wake storms after loading.
;     0 = off, 1 = on, 2 = installed but switched off (A/B it live in the mod menu: 1.6.0 - OPT-IN). Tuning: WG_*.
WG = 1
; TG: EXPERIMENT, opt-in. Logic tick governor: the game's logic tick cap follows the rendered frame rate (floor TG_Floor,
;     default 30) instead of the in-game cap, so the CPU stops computing ticks whose result is never shown. It changes
;     the simulation step to 1/30 s like the game's own 30 FPS mode, and a button tap must then be held ~33 ms
;     instead of ~22 ms to be seen. Needs VRR and L1 (under Proton: L1OnWine = 1); without L1 it refuses to engage and
;     logs why. 0 = off, 1 = on. Always switchable live in the mod menu when VRR is installed.
TG = 0
; DS: the main loop's 1 ms "no new frame yet" retry spin sleeps on a high-resolution timer for most of the millisecond
;     (its exit test is unchanged). Only matters with TG or near the fps cap. Needs L1 installed. 0 = off, 1 = on,
;     2 = installed but switched off.
DS = 0
; DQ (1.7.32): the same retry spin re-checks for a new frame after DQ_QuantumUs (default 200 us) instead of a blind 1 ms,
;     so a frame that is ready 0.1 ms in no longer idles 0.9 ms. Measured on PC: 0.1-1.0 ms/frame of the main thread sat
;     in this spin (r6/r7/r9). Same CPU use (it spins either way). With DS on too, DS only sleeps inside the shorter
;     quantum. 0 = off, 1 = on, 2 = installed but switched off. v2.02 only.
DQ = 1
; P1E7 (1.7.32): the main thread prefetches the next texture's streaming object in the per-texture loop of 1E7050 (only
;     loads + prefetches, same results). Target cost 0.3-0.5 ms/frame on PC; untested on its own (round 9 ran it only in
;     a bundle that measured slower). 0 = off, 1 = on, 2 = installed but switched off. v2.02 only.
P1E7 = 1
; LK: 18 locked "atomic loads" in worker code (object update, meshlet jobs, job system) become plain loads (same values,
;     no exclusive cache-line grab). Code bytes: on/off at launch. 0 = off, 1 = on.
LK = 1
; MA (1.7.39): the same idiom on the MAIN thread: 25 locked "atomic loads" (xor eax,eax; lock cmpxchg [m],<zero>) in the
;     meshlet bookkeeping (4AA34 / 4B104 / 419A8) and once per draw (1E835B) become plain loads. Same values (an aligned
;     load is atomic); drops the full fence that keeps those pointer-chasing loops from overlapping their cache misses.
;     Measured target: 0.3-0.4 ms/frame of the main thread on the PC (expected saving ~0.05-0.15 ms, an estimate).
;     Code bytes: on/off at launch, no menu row. 0 = off, 1 = on. v2.02 only.
MA = 1
; BPO (1.7.40): BoundsFromPartObbs 71C60 on the game-update thread (notes\bounds-partobbs.md). Each frame it rebuilds
;     every body part's rotation from 4 packed halves (half unpack, SinCos, sqrt, divide); the parts are model data, so
;     the result is cached per 8-byte key (bit-identical: a hit returns exactly what the stock code computes). Also the
;     two locked reads of the object's ready word per part become plain loads, and the part box copy forwards.
;     Est. 0.1-0.2 ms/frame of the update thread on the PC. 0 = off, 1 = on, 2 = installed but switched off (live row).
BPO = 1
; W1B (1.7.42): main thread, glyph padding clear 61B1C (notes\w1b-rpa.md). Each glyph row clears pad = 1 dword in the
;     write-combined atlas staging; W1 does it with `rep stosd` (start-up cost per row). W1B uses the game's own loop with
;     a plain store (same bytes, same order). Offline: 120 -> 25 ns per row on WC memory (PC). Est. 0.15-0.25 ms/frame
;     on the Ally. Works with W1 = 1 (switch off = W1) or W1 = 0 (switch off = the original loop).
;     0 = off, 1 = on, 2 = installed but switched off (live row). v2.02 only.
W1B = 1
; RPA (1.7.42): main thread, RenderParamsAssign 247950 (notes\w1b-rpa.md): 29.6 KB of dword moves -> the same 21 byte
;     ranges copied with 16-byte moves (padding untouched; bit-exact on 300k random calls). Est. 0.07-0.1 ms/frame on
;     the Ally. 0 = off, 1 = on, 2 = installed but switched off (live row). v2.02 only.
RPA = 1
; CP: collision workers prefetch the colliders they will process next (same results, fewer memory stalls).
;     0 = off, 1 = on, 2 = installed but switched off (live switch in the mod menu).
CP = 1
; SPF: the stage-update worker prefetches placeables 4 entries ahead (same results). 0 / 1 / 2 as CP.
SPF = 1
; --- 1.7.12 (v2.02 only, all default 0; each also has a live switch in the mod menu, 2 = installed but switched off) ---
; MQ: skeleton bone matrices (MatrixFromScaleQuatTrans) in SSE, bit-identical results (~1 % of each scheduler thread on PC).
;     0 = off, 1 = on, 2 = installed but switched off. Needs SSE4.1.
; -1 (default) = auto by OS: 1 under Proton/Wine (CPU power), 0 on native Windows (no gain measured). 0/1/2 force.
MQ = -1
; PT1: texture tile requests take the streaming pool lock once per texture instead of once per tile touch (same state).
;     0 = off, 1 = on, 2 = installed but switched off. Switching off live is always safe (never restores bytes mid-loop).
PT1 = 1
; DL: collision update skips a part-map search whose result is thrown away (second site of the CP group; installs the CP
;     site group, CP itself stays as set above). 0 = off, 1 = on, 2 = installed but switched off.
DL = 0
; CpuStats: 1 = count MQ calls and DL skips for the "stats cpu:" line (every 30 s). PT1 counters are always on. Costs a bit.
CpuStats = 0
; RWb (1.7.2, v2.02 only, code bytes: next launch): the resource-state spin (ResStateWaitSwap) wakes a ResourceLoad worker
; once per 256 spins (with its Sleep(0)) instead of every spin - same exit condition and work, far fewer futile wakes
; after level loads (notes\stutter.md 3.5). 0 = off, 1 = on.
RWb = 1
; ESM1 (1.7.44, v2.02 only, code bytes: next launch, GPU): renders the directional exponential shadow map at 1024x1024 instead of 2048x2048
; (SHADOW_QUAL STANDARD/HIGH/HIGHEST pick 2048). The ESM only feeds volumetric-fog in-scattering and LPV indirect shadowing (low
; frequency); its blur passes are address/bandwidth-bound and shrink 4x. Expected ~0.2 ms on an RX 9070, ~0.5-0.7 ms on an RX 6650 XT.
; Fog light shafts may get slightly softer: A/B with a screenshot diff before keeping. 0 = off, 1 = on. (notes\gpu-resolution-audit.md)
ESM1 = 1
; MPCS (1.7.47, v2.02 only, code caves: next launch, GPU): MPC tail skip in MeshletPreculling (notes\meshlet-frontend.md 3). With the
; `mpc` build of shader_dx12\0x29ee0902.file installed (gpu-shaders\apply_sweep.ps1 -Item mpc; the mod checks its sha256 and refuses
; otherwise) MPC #23 already leaves the final prefix sums when the chain has <= 1024 draws and the replaced #28-#31 return at once:
; the engine still records them (4 dispatches + 8 UAV barriers) and #26 (1 dispatch + barrier) per chain, 2.7-6 chains per frame.
; MPCS drops exactly those recordings (proof: gpu-shaders\culling\verify_culling.py check B; tests\run_mpcs_harness.py for the caves;
; runtime self-check: [Profiler] MpcCheck). Same picture. 0 = off, 1 = on, 2 = installed but off. Log: "stats/s MPCS: ...".
MPCS = 0
; TR (1.7.45, Windows; live menu row "Steady timer resolution"): the game's HID pad-reader threads wrap every Sleep of their
; poll loop in timeBeginPeriod(1) / timeEndPeriod(1) (~200-500 timer-resolution changes per second); between the pairs the
; process can fall back to 15.6 ms Sleep granularity. TR holds 1 ms once for the session and skips the game's own pairs
; (balanced per thread). Same Sleep(4) for the HID threads. No effect under Proton (Wine timers are always precise).
; "stats/s TR:" line every 30 s = the game's call rate + the system timer. 0 = off, 1 = on, 2 = hooks installed, switch
; off (counters only). (notes\game-logic-audit.md 3)
TR = 0
; RTP (1.7.58; live menu row "Render threads first"): raises the Windows scheduling priority of the render critical path -
; [App]Game (draw prep), SynergisticDispatcherTask (D3D12 replay), the thread that calls the game's Present and a named
; ExecuteCommandLists thread - to [Tuning] RTP_Level, so when every core is busy (6-core CPUs: the logic and its job workers
; tick 120-240 times/s while ~35 frames/s are drawn) the frame is not delayed behind logic work. Same game code and output;
; the logic ticks on the CPU time left (VRR keeps the game speed, as on a slower CPU). OFF restores each thread's previous
; priority. "stats RTP:" line every 30 s. 0 = off, 1 = on, 2 = installed, switch off. (notes\cpu-bound-midrange.md)
