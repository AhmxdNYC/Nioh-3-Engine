; refresh) even though the stock game normally presents with 0 + tearing allowed. On a FreeSync/G-Sync PC that turns
; "independent flip" into "composed flip": ~7 ms more display latency and 8-20 % of frames never shown (PresentMon).
; 1 = always present with SyncInterval 0 + ALLOW_TEARING when the swapchain allows it (windowed/borderless, created with
;     ALLOW_TEARING - the game's is). No tearing while the fps stays inside the display's VRR range (keep a cap, e.g. 120
;     with FG on a 240 Hz panel); above the panel's refresh it tears. Same image otherwise.
; -1 = auto: only while the game's VSync setting is OFF (then tearing-allowed presents are what you chose; a stuck 1 is a bug).
; 0 (default) = the game's own present arguments. Windows only: ignored under Proton/Wine. FG pacing is not touched.
VrrPresent = 0

[GpuOpt]
; D3D12 barrier batching on the game's command lists (notes\gpu-barriers.md).
; 0 = off, 1 = on, 2 = hooked with counters only (switch it on live in the mod menu: GPU barrier batching).
Barriers = 0
; FrameOverlap (1.7.59-fo1, EXPERIMENTAL): overlap frame N's D3D12 replay tail + Present (moved to the replay thread) with frame
; N+1's recording on the main thread, instead of the main thread waiting ~5-6 ms per frame for the replay to drain. Hard
; fallbacks to the stock frame end (render-size change, device reset, queries in use, back-buffer mismatch). 0 = nothing
; installed, 1 = ON, 2 = installed with the switch OFF (live: Tuning.FO = 0/1, Tuning.FO_Pct). notes\renderer\frame-overlap.md
FrameOverlap = 0
; TileBatch (1.7.2, notes\gpu-tiles.md): merges consecutive UpdateTileMappings of the game on the same queue into one call
; when that provably gives the same final mapping (same resource/flags/heap, single-tile regions, no tile in both);
; the merged call is issued before any other operation on that queue. 0 = off, 1 = on, 2 = count only (no change).
TileBatch = 0
; 1: state setters do not split a batch; 0: only literally adjacent ResourceBarrier calls merge
MergeAcrossBinds = 1
; drop a UAV barrier already covered by one in the same batch (result-neutral)
DropDuplicateUav = 1
; drop A:S1->S2,A:S2->S1 pairs for RT/depth-write/read-only S1 (result-neutral; counted anyway)
DropUndoPairs = 0
; 1.7.10 barrier rewrites for the Ally (Proton / vkd3d-proton only; no effect elsewhere). All three are live switches in the
; mod menu (GPU section) and are counted in the 'stats/s gpuopt' line (rewrites per frame, kept_* = candidates left alone).
; Design and safety conditions: notes\vkd3d-audit.md Addendum B. Needs the hooks (Barriers = 1 or 2).
; R2a: a COMMON -> X barrier on a BUFFER without ALLOW_UNORDERED_ACCESS gets its real previous state (last tracked state |
;      NON_PIXEL_SHADER_RESOURCE | PIXEL_SHADER_RESOURCE) instead of COMMON (vkd3d maps COMMON to ALL_COMMANDS = a full GPU idle).
R2a = 0
; R2b: EXPERIMENT - the same for buffers WITH ALLOW_UNORDERED_ACCESS (execute-indirect arguments, UAV binds). WARNING: this
;      narrows the wait for writes that can come from carried-over descriptors; wrong results (stale data, flicker) are possible
;      and it may save nothing on RADV. Judge only with a screenshot compare. Leave at 0 for normal play.
R2b = 0
; R1: EXPERIMENT - drops read -> read transitions whose new state is a superset of the old one (only VCB/IB/NPSR/PSR bits).
;     Not spec-exact (the dropped barrier is the visibility operation for the new read stages); needs an image compare.
R1 = 0
MaxBatch = 64
DeferThreads = SynergisticDispatcher
AnyCaller = 0
; e.g. 300000: write Nioh3EngineFix.gpuopt-trace.csv once (resource-level barrier log)
; (1.7.9: CSV has a caller2_rva column; Ally recipe: Barriers = 2, TraceRecords = 300000, then re\scripts_d3d12\vkd3d_cost.py)
TraceRecords = 0
TraceDelaySec = 30
; seconds after d3d12.dll + dxgi.dll are loaded before the GpuOpt hooks install themselves (0..600; default 20)
InstallDelaySec = 20
; CbvMirror (1.7.52, CM): GPUs WITHOUT Resizable BAR / SAM read every per-draw constant buffer from system memory over PCIe
;   (the engine puts them in its 700 MB UPLOAD ring). CM copies them into a VRAM mirror ring once per submission and points
;   the descriptors there. 0 = off (default, nothing installed). 1 = auto: only when the UPLOAD heaps really are in system
;   memory (DXGI non-local usage >= 75 % of them), never on UMA (handhelds/APUs) or under Wine/Proton. 2 = force (test: runs
;   the redirect even with ReBAR, where it gains nothing). Needs the overlay's queue hook (installed automatically).
;   CbvMirrorMB = VRAM ring size (8..512, default 128). CbvMirrorAllSites = 1: every CBV in the ring, not only the per-draw
;   recorder (riskier). grep 'CM:' / 'stats/s CM' in the log. notes\root-cause-vram-streaming.md. Next launch.
CbvMirror = 0
CbvMirrorMB = 128
CbvMirrorAllSites = 0
; CbvMirrorSites (1.7.55): which CBVs CM mirrors (ignored with CbvMirrorAllSites = 1). 1 = per-draw recorder 118F89 (default,
;   the 1.7.52-1.7.54 behaviour); 2 = only the compute dispatch constants (495B2E / 117F20: meshlet culling / LOD, async
;   clouds / fog; ~250 small CBVs per frame); 3 = both. notes/rdna2-meshlet-slowdown.md. Next launch.
CbvMirrorSites = 1
; CbvMirrorQueue (1.7.54): 0 = copies in a prologue list on the game's own queue, same submission, no cross-queue waits
;   (default); 1 = the 1.7.52 own COPY queue + fence waits (measured +15 ms on pc2: do not use). CbvMirrorComputeCopy = 1:
;   async COMPUTE queues copy the same ranges for their own lists (0 = they rely on the DIRECT copies; faster, may race).
CbvMirrorQueue = 0
CbvMirrorComputeCopy = 1
; SceneBufMirror (1.7.57, SBM; EXPERIMENT, notes\rebar-fix-v3.md): for PCs WITHOUT Resizable BAR / SAM that cannot turn it on.
;   The meshlet culling / LOD kernels read the per-frame scene buffers (instance matrices, LOD root lists, offsets) that the
;   game writes into UPLOAD memory; without ReBAR that is system RAM read over PCIe (pc2: MshLod#1 at 0.7 GB/s, MIC / MshLod
;   1.2-1.7 ms each). SBM copies those buffers once per frame, right after the game wrote them, into VRAM (one copy list on its
;   own COPY queue, the game's queues wait for it once) and points the game's views of them there. 0 = off (default, nothing
;   installed); 1 = auto: only when the ResizableBAR check ([General] ReBarNotice) found the UPLOAD heaps in system memory,
;   never on UMA / Proton; 2 = force (test; on a ReBAR PC only meaningful with [Profiler] MemStats = 2 + VSForceSysUpload = 2).
;   SceneBufMirrorQueue: 1 = own COPY queue (DMA engine, default), 0 = the game's DIRECT queue. grep 'SBM' in the log.
;   Turning Resizable BAR on in the BIOS is the real fix (README). Next launch.
SceneBufMirror = 0
SceneBufMirrorQueue = 1

[Profiler]
