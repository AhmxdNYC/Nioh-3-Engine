; PCM (1.7.58; live menu row "Faster pipeline lookup"): the D3D12 replay thread (SynergisticDispatcherTask) looks every dirty
; draw's pipeline up in a B-tree (PsoCacheBTreeFind 119820: 0x90-byte entries, hash then 128-byte memcmp per step). PM keeps
; copies of the entries it found in a 4096-slot table (same hash AND same 128-byte key = the same entry, copied exactly as
; the game copies it) and starts over whenever the cache changes (entry count, capacity or root). Same pipelines. Target:
; the dispatcher is the frame's tail on CPU-bound PCs ([App]Game spins in WaitDispatcherDrainSpin 418F40 until it drains).
; "stats/s PCM:" line every 30 s. 0 = off, 1 = on, 2 = installed, switch off. (notes\cpu-bound-midrange.md)
