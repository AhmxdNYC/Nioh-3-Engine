; non-local used/budget (game's adapter), system RAM; "since start" deltas. Measurement only. 0 = off.
; MemStats = 2 (1.7.48 VS probe): + one "stats vs:" line per second - VRAM, the engine texture page pool (size, used, occupancy vs
; its 85 % mip-bias controller, last-frame hits/misses/queue-full) and D3D12 MakeResident/Evict/CreateHeap/CreateCommittedResource
; counts and MB (vram vs system memory). Hooks 5 device vtable slots. notes\root-cause-vram-streaming.md
MemStats = 0
