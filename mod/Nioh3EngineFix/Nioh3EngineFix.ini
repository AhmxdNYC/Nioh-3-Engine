; --- 1.7.23 (v2.02 only, default 0, next launch; notes\loading-ally-fixed.md 8.5 / 8.3) ---
; LoadOnlyCpuFixes: GF, W6 and RWb only while a level loads. Plain language: the three CPU-power fixes (GPU-fence waits, the
;     present wait, the resource-spin wake) run during loading screens, where they hand CPU back to the loader threads, and the
;     game runs its stock code while you play. Detail: GF and W6 are installed even when their keys are 0; RWb gets a switchable
;     cave at 1A3146A instead of its 22-byte rewrite (first instruction only becomes `jmp cave`; tests\test_patterns.py "LO"
;     proves the cave equals stock with its switch off and RWb with it on). A 10 ms thread watches G+58Ah: on the set it turns
;     all three on, on the clear it restores what they were (your GF/W6/RWb keys or menu choice), so GF = 1 etc. still means
;     "also while playing". Log: "LO: on at 58A set #n", "LO: off at 58A clear #n (+x s)". Expected: Ally loads 3-10 s faster,
;     PC 0. 0 = off, 1 = on. Log: "LoadOnlyCpuFixes = n" at start, then the "LO:" lines.
LoadOnlyCpuFixes = 0
; EP: event pool for the archive reads. Plain language: the game makes and destroys one kernel event per file read (~640k
;     per Ally load; each is a slow wineserver call under Proton); EP keeps used events and hands them out again. Detail:
;     FileReqAlloc's CreateEventA (311EE1, manual-reset, not signalled, unnamed - bytes checked) takes from a pool of up to
;     4096; FileReqFree's CloseHandle (311F89) returns an event only if NtResetEvent says it WAS signalled (a signalled event
;     has no read pending; anything else is really closed, as stock). Same bytes read, same results. Expected: Ally 0-8 s
;     per load, PC ~0. Counters on the "ReadProbe #n events" line when ReadProbe is on. -1 = auto (default, 1.7.24: ON under
;     Wine/Proton where the Ally cut 98.9 -> 50.1 s, OFF on native Windows until the PC A/B is in), 0 = off, 1 = on. The
;     decision is logged on the "EP: ini ..." line.
EP = -1

; --- 1.7.25 read fixes (v2.02 only, default 0, next launch; src\readfix.h, notes\loading-ally-fixed.md 8.7) ---
; All of them read the same bytes from the same files; any read they cannot do exactly is passed to the game's own call.
; Only files inside the game's package\ folder are touched. Per load: "ReadFix #n SR:" and "ReadFix #n (...)" lines.
; SR: synchronous redirect. Plain language: under Proton an "overlapped" file read costs ~55 us of bookkeeping even when the
;     data is in memory, a plain read ~2 us (Ally 1.7.23 calibration); the game does ~550k tiny overlapped reads per load
;     (site 740392, 24.9 s on one loader thread). SR does each of those as a plain read on a second, read-only handle to the
;     same file and reports it finished at once (event signalled), which the game's code already accepts. Wine/Proton only
;     (refused on Windows). -1 = auto (default, 1.7.28: 1 under Wine/Proton, where the Ally R2 cut 47.25 -> 38.45 s with
;     740392 47 -> 17 us per read, 0 failures; off on native Windows), 0 = off, 1 = during loads, 2 = always. The decision is
;     logged on the "SR: ini ..." line.
SR = -1
; RC: read cache. Small reads (<= RCMaxReadKB) are copied from aligned RCKB blocks kept in RAM (RCMB MB); a miss reads the
;     whole block once (through the SR handle under Proton). The Ally reads are 91-93 % sequential, so most become memcpy.
;     0 = off, 1 = during loads (memory released 10 s after each load), 2 = always.
RC = 0
RCMB = 64
RCKB = 64
RCMaxReadKB = 64
; AQ: async archive reads. Reads at the three overlapped submit sites are queued to AQThreads worker threads and the game's
;     event is signalled when they finish (the Windows overlapped contract). For a device-bound load; SR/RC win first if a
;     read can be served at once. 0 = off, 1 = during loads, 2 = always.
AQ = 0
AQThreads = 4
; TSY: TrySync worker threads (stock 3; 3..8). Boot-time: written before the game sizes its thread pools; the log line
;     "TSY: TrySync pool sized to n threads" confirms it. 0 = off.
TSY = 0
; SH: open every archive handle synchronous (FileOpenWin32 314181 imm 200h -> 0). Boot-time, Wine/Proton only. The cruder
;     sibling of SR (it also changes the ReadFileEx path); use SR first. 0 = off, 1 = on.
SH = 0

; --- 1.7.26 PF trace prefetch (v2.02 only, default 0, next launch; src\prefetch.h, notes\loading-ally-fixed.md 8.8) ---
; PF: Plain language: on the Ally the resource loader reads ~2.7 GB in 12.6k cold random reads (ReadFileEx 631FD5, ~0.8 ms
;     each, ~10 s per load) plus 18k archive chunks (31305A, ~0.2 ms each); the data is not in RAM yet, so each read waits
;     for the drive. PF remembers which file ranges a load read (Nioh3EngineFix_pf0..3.bin next to this ini) and, when the
;     next load starts with the same reads, reads those ranges a little ahead of the game on PFThreads helper threads, so
;     the game's own reads find the data already in the OS file cache. The game's reads, results and files are not
;     changed; only package\ files are read. The first load after turning it on only records. 0 = off, 1 = record +
;     prefetch, 2 = record only (for the comparison arm of an A/B). Log: "Prefetch #n" lines per load.
PF = 0
; helper threads (1..16), how far ahead of the game they may read (MB, 64..4096), how many traces are kept (1..8), and how
; many of the first 24 package reads of a load must be in a trace to use it (%).
PFThreads = 4
PFLeadMB = 768
PFTraces = 4
PFMatchPct = 50

