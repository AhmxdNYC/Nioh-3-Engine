; GL1: the mission thread's two task-list walks (proximity pass over ~4,400 tasks, task-state pass) ask the CPU to fetch the
;      task 3 entries ahead into cache. Plain language: the game stalls waiting on memory for every task in those loops;
;      this starts the fetch early. Detail: prefetcht0 of lines +40h/+80h/+C0h of the task at entry i+3, only while that
;      entry lies inside [first,last); sites E266D1 and E26690; no architectural effect, game results are identical.
;      Saves about 2-3 % of one core on PC; the Ally is GPU-bound so expect ~0 fps. 0 = off, 1 = on.
GL1 = 1
; LC: the two resource-load managers keep up to 16 requests in flight instead of 10 (the boot-flag value 1 stays 1).
;     Plain language: level loads can start more file/decode steps at the same time. Detail: the same requests in the same
;     queue order (dependencies are checked per request); only the in-flight limit changes, in both managers (1FEE98 and
;     1FF3BA), so it also applies while playing, when the game streams. Helps only if the loaders are the bottleneck
;     (LoadStats: in-flight at cap for most of the busy time). 0 = off, 1 = on (cap 16), 11..64 = that cap (1.7.30). Ally
;     1.7.25: the G8 wait (~15.5 s of 38.5) is manager A draining ~1000 queued requests at cap 10 while its pools, the disk
;     and half the CPU sit idle (notes\loading-ally-fixed.md 8.9); try 16 and 32. PC: 16 was no gain (3 TrySync threads full).
LC = 0
; LW: the resource-load managers' Sleep(1) polls wait on an event instead; a finished resource step wakes them at once.
;     Plain language: the loaders notice finished work sooner instead of checking once per millisecond. Detail: the three
;     Sleep(1) calls (1FEE68, 1FF18C, 1FF371) become WaitForSingleObject(event, 1 ms) - the same 1 ms upper bound - and
;     ResourceStepJob_Run (1343D35) sets the event after its done bit, only while a manager is waiting. Up to ~1 ms saved
;     per step. LoadStats cannot count those three Sleep sites while LW is on (they are no longer the original bytes).
;     0 = off, 1 = on.
