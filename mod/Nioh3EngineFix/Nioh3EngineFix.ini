[Tuning]
; W3 wait per empty message queue (ms)
W3_TimeoutMs = 1
; R1 wait per round (ms); 0 = stock busy poll
R1_TimeoutMs = 2
; L1: keep the last N microseconds before the frame deadline as the original precise spin
L1_MarginUs = 1000
; L1: don't sleep for less than this (microseconds)
L1_MinSleepUs = 500
; PP: page-pool sweep period in frames (2, 4, 8, 16)
PP_Period = 4
; BPO: which parts run when BPO is on (1 = rotation cache, 2 = plain ready-word loads, 4 = box copy; 7 = all)
BPO_Mask = 7
; BPO: quaternion memo size, 2^N entries of 32 bytes (10-18; 14 = 16384 entries = 512 KB)
BPO_TableBits = 14
; E1: invisible effects update every N-th pass (1, 2, 4, 8)
E1_N = 2
; W6: microseconds to spin (pause) before sleeping on the present flag; 0 = sleep at once
W6_SpinUs = 50
; W6: WaitOnAddress timeout per round (ms) - bounds the wake-up delay if a wake is ever missed
W6_TimeoutMs = 1
; IK: longest wait (ms) for the fresh pad read at the frame start. 0 (default) = don't wait there: the game update
; joins the input worker later anyway, so the read is still used (v1.2.0 waited 2 ms and timed out every frame)
IK_PadWaitCapMs = 0
; GF: longest single sleep on the fence event (ms); the game re-checks the fence after each one
GF_TimeoutMs = 100
; WG: skip a wake-one while at least this many workers of the pool are woken and not yet running (1-8)
WG_MaxPending = 1
; WG: a pending wake older than this (microseconds) no longer gates (safety net; it can only make WG wake more)
WG_WindowUs = 2000
; TG: lowest logic tick rate the governor uses (24-60; never below the VRR clamp minimum + 1)
TG_Floor = 30
; TG: tick cap = rendered fps x this % + 2 (100-200), so the render rate can still grow until the GPU is the limit
TG_RatioPct = 125
; DS: wake this many microseconds before the 1 ms retry spin ends; the rest is spun as before (50-900)
DS_MarginUs = 150
; DQ: the retry spin's quantum in microseconds while DQ is on (50-1000; stock is 1000)
DQ_QuantumUs = 200

[Latency]
; How many frames the game may queue ahead of the GPU (IDXGISwapChain2::SetMaximumFrameLatency on the game's waitable
; swapchain - the one the R1 fix waits on). The game never sets it, so its value is 1 = least input delay. 2-3 can give
; more fps when the GPU is the limit, at up to one frame more delay. 0 = leave the game's value.
; Under Proton, LOWERING it in the mod menu only applies after the swapchain is rebuilt or the game restarts.
MaxFrameLatency = 0

[GpuOpt]
; D3D12 barrier batching on the game's command lists (notes\gpu-barriers.md).
; 0 = off, 1 = on, 2 = hooked with counters only (switch it on live in the mod menu: GPU barrier batching).
Barriers = 0
; TileBatch (1.7.2, notes\gpu-tiles.md): merges consecutive UpdateTileMappings of the game on the same queue into one call
; when that provably gives the same final mapping (same resource/flags/heap, single-tile regions, no tile in both);
; the merged call is issued before any other operation on that queue. 0 = off, 1 = on, 2 = count only (no change).
TileBatch = 0
; 1: state setters do not split a batch; 0: only literally adjacent ResourceBarrier calls merge
MergeAcrossBinds = 1
; drop a UAV barrier already covered by one in the same batch (result-neutral)
DropDuplicateUav = 1
; drop A:S1->S2,A:S2->S1 pairs for RT/depth-write/read-only S1 (result-neutral; counted anyway)
DropUndoPairs = 0
; 1.7.10 barrier rewrites for the Ally (Proton / vkd3d-proton only; no effect elsewhere). All three are live switches in the
; mod menu (GPU section) and are counted in the 'stats/s gpuopt' line (rewrites per frame, kept_* = candidates left alone).
; Design and safety conditions: notes\vkd3d-audit.md Addendum B. Needs the hooks (Barriers = 1 or 2).
; R2a: a COMMON -> X barrier on a BUFFER without ALLOW_UNORDERED_ACCESS gets its real previous state (last tracked state |
;      NON_PIXEL_SHADER_RESOURCE | PIXEL_SHADER_RESOURCE) instead of COMMON (vkd3d maps COMMON to ALL_COMMANDS = a full GPU idle).
R2a = 0
; R2b: EXPERIMENT - the same for buffers WITH ALLOW_UNORDERED_ACCESS (execute-indirect arguments, UAV binds). WARNING: this
;      narrows the wait for writes that can come from carried-over descriptors; wrong results (stale data, flicker) are possible
;      and it may save nothing on RADV. Judge only with a screenshot compare. Leave at 0 for normal play.
R2b = 0
; R1: EXPERIMENT - drops read -> read transitions whose new state is a superset of the old one (only VCB/IB/NPSR/PSR bits).
;     Not spec-exact (the dropped barrier is the visibility operation for the new read stages); needs an image compare.
R1 = 0
MaxBatch = 64
DeferThreads = SynergisticDispatcher
AnyCaller = 0
; e.g. 300000: write Nioh3EngineFix.gpuopt-trace.csv once (resource-level barrier log)
