; counts as this many). Shorter PSO runs are merged into their neighbours and the interval is billed to its longest run (the total is
; exact, small PSOs next to big ones are billed to the big one). 1 = a stamp at every PSO change (old behaviour). The timestamps
; are the whole GPU cost on the Ally (about 1400 stamps/frame in 1.7.7 = ~+10 ms), so this key trades per-PSO detail for speed.
GPUProf2_MinRun = 4
