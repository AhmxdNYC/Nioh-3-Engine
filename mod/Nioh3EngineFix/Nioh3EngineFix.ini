SceneBufProbe = 0
; LoadStats (1.7.11): per-level-load measurement - MEASUREMENT ONLY (notes\loading.md). For every loading window (engine stop flag
; 58A) one summary: seconds, frames, process CPU, stage-ready time, resource-loader occupancy, load-end ready wait, event-scene
; seconds, MB read, zlib inflate CPU time, PSOs created. 2 = also one line per second inside the window. 0 = off (nothing
; installed). Next launch. grep LoadStats in the log.
LoadStats = 0
; LoadStats = 3 (1.7.17): like 2, plus a 1 s tick line OUTSIDE the 58A window too (whenever frames advance: 58A, frame delta, FT/B sequencer state,
; first failing gate), so the time from Continue to the 58A set is covered. Log volume: 1 line/s while playing.
; LoadGates (1.7.17, needs LoadStats >= 1): probe LG - MEASUREMENT ONLY, game behaviour unchanged. Hooks the 9 gate calls of LoadIsLoadEnd 3B3424
; (pass-through, result untouched) and polls the FastTravelSeq / WarpSeqB states every 10 ms. Per load it logs "LoadGates #n": evaluations, which
; gate failed first and for how long it held (seconds + % of the window), first/last fail and flip-to-pass times relative to the 58A set,
; "holder: Gx"; plus "LoadSeq FT 5->6 +12.3 s" state changes and the 58A owner. notes\loading-bottleneck.md section 5. 0 = off. Next launch.
LoadGates = 0
; ReadProbe (1.7.23, needs LoadStats >= 1): probe RP - MEASUREMENT ONLY (notes\loading-ally-fixed.md 8.2). Hooks all 13
; ReadFile calls + the ReadFileEx call, the archive layer's CreateEventA / CloseHandle / WaitForMultipleObjects and the
; game's read-cache lookup (all pass-through). Per load ("ReadProbe #n" lines): per call site calls, MB, in-call time and a
; duration histogram, size classes, OVERLAPPED vs file-pointer reads, synchronous vs overlapped handles, pending/errors,
