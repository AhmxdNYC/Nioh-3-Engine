# ft_vrr_patch.fsx v2 config (key=value). Tiers = REN_FPS 30/60/120.
arm30=1
arm60=1
arm120=1
# measured-fps clamp per tier (max is also the limiter cap; it can't exceed the tier)
min30=20
max30=30
min60=24
max60=60
min120=48
max120=120
# 1 = quantize menu-input hold timers to 0.25 (60 Hz units) with carry while armed (Lyall-style); only if menu repeat misbehaves
