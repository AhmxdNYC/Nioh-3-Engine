; Nioh3BossRematch.ini - the boss logger + boss rematch add-on (separate from Nioh3EngineFix; notes\boss-rematch-addon.md).
; Put Nioh3BossRematch.asi, this ini and Nioh3BossRematch_bosses.tsv next to the other ASI mods. Log: Nioh3BossRematch.log.
; Patch-resilient: every game site is found by a wildcard byte pattern or a script-native name; each feature group switches
; itself off (with the reason in the log) when its sites are not found, the others keep working. Works with or without
; Nioh3EngineFix.asi; the old [Debug] BossLog / RematchLog / InvLog and [Rematch] keys of Nioh3EngineFix.ini moved here.

[General]
Enabled = 1
; seconds to wait for the game's code to be decrypted (SteamStub) before resolving anyway
DecryptWaitSeconds = 120

[Rematch]
; SOLO / OFFLINE ONLY. 0 = off (default): nothing is installed. 1 = the overlay menu lists every boss of the catalogue with its route
; (replay / hidden duel / direct / picture scroll / no route) and status (beaten on this journey, verified or not).
Enable = 0
; R rows: 0 = open the game's own Battle Scroll replay list (R-a; you pick the mission there); 1 = start the mission directly (R-b,
; MissionRequestById exactly as the shrine replay confirm; only missions cleared on this journey).
DirectStart = 0
; 1 = while the game's replay list is opened by the add-on, the 3 hidden duels are listed too (record bit 0x4000 cleared, restored after)
HiddenDuels = 0
; 1 = also list bosses that are not beaten yet and bosses without a route (greyed, with the reason)
ShowAll = 1
; 1 = allow rows that are not verified yet (direct records, hidden duels, Picture Scroll records); verify_all.ps1 verifies them
ShowUnverified = 0
; Fight now (straight to the boss) = route E1: each beaten boss row gets a 'Fight now' line that starts its mission at the start point
; next to the boss arena (MissionRequestById with the start point the game's Continue uses; nothing patched, no story flag or save
; written by the add-on). Solo/offline, missions cleared on this journey only. 0 = off (default), 1 = on.
FightNow = 0
; Fight now (in the arena): with FightNow = 1, each boss shows two lines: 'Fight now (in the arena)' = the start point + a warp just
; inside the arena trigger after the load (the game's own Player::SetPos path; again after a death reload) so the game's trigger starts
; the fight, and 'Shrine before the boss' = the start point alone. 0 = no warp (default; the arena line is greyed), 1 = warp.
FightNowWarp = 0
; Fight now (in the arena) without the shrine first: while the Fight now runs, the start point's warp-point record (in memory only)
; spawns at the arena point, so the load ends with you already in the arena (and a death reload puts you back there). The start
; point id the game keeps / may save never changes; the record is restored when the Fight now ends. If it does not take, the warp
; above runs as before. 1 = on (default, needs FightNowWarp = 1), 0 = load at the start point and warp after the landing (1.3.x).
FightNowSpawn = 1
; 1 = at every boss fight start, append the player position to Nioh3BossRematch_arenas.tsv (read at launch: it gives / corrects the
; arena point of that boss). The position is always written to the log ('Rematch: arena:').
ArenaCapture = 0
; Self-test without the pipe (any device, e.g. Proton): a comma list of row ids, or 'arena' = every row with an arena point. After the
; save loads the add-on runs Fight now on each row by itself, logs 'SELFTEST <id> PASS/FAIL', leaves the mission, goes on, and ends
; with 'SELFTEST DONE'. It plays real missions on the loaded save: back the save up first. Empty = off (default).
SelfTest =
Catalog = Nioh3BossRematch_bosses.tsv
Verified = Nioh3BossRematch_verified.tsv
Arenas = Nioh3BossRematch_arenas.tsv

[Menu]
; the add-on's own overlay (a topmost window; no graphics hook). Overlay = 0: pipe / log only.
Overlay = 1
Hotkey = F7
; hold View + D-pad Up for 1 s to open / close; the pad is masked from the game while the menu is open
PadGesture = 1

[Remote]
; 1 = \\.\pipe\nioh3bossrematch (local only) for tools\rematch\verify_all.ps1
Pipe = 0

[Debug]
; BossLog: read-only boss fight logger (fight start/end, placements created, mission flags, clear, rewards). grep BossLog
BossLog = 0
; RematchLog: Phase 0 logger of the rematch design (Emaki table, mission requests, replay menu, getters, end/retry). Implies BossLog hooks.
RematchLog = 0
; InvLog: every inventory add of the session with its caller (grep InvLog)
InvLog = 0
